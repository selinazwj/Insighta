<style>
    /* ── STATS ── */
    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 0; border: 0.5px solid var(--line); border-radius: 10px;
      overflow: hidden; margin-bottom: 28px; background: var(--bg);
    }
    .stat-item {
      padding: 20px 24px; border-right: 0.5px solid var(--line);
    }
    .stat-item:last-child { border-right: none; }
    .stat-n {
      font-size: 28px; font-weight: 300; color: var(--green);
      letter-spacing: -1px; margin-bottom: 4px;
    }
    .stat-l { font-size: 12px; color: var(--ink3); font-weight: 500; }

    /* ── TYPE TABS ── */
    .type-tabs { display: flex; gap: 2px; margin-bottom: 16px; }
    .type-tab {
      font-size: 13px; font-weight: 500; color: var(--ink3);
      padding: 6px 14px; border-radius: 6px; cursor: pointer;
      border: 0.5px solid transparent; background: none;
      font-family: var(--sans); transition: all .12s;
    }
    .type-tab:hover { color: var(--ink2); background: var(--bg3); }
    .type-tab.active {
      background: var(--bg); color: var(--green);
      border-color: var(--line); font-weight: 600;
    }

    /* ── STUDY LIST ── */
    .study-list { display: flex; flex-direction: column; gap: 8px; }

    .study-row {
      background: var(--bg); border: 0.5px solid var(--line);
      border-radius: 10px; padding: 16px 20px;
      display: flex; align-items: center; gap: 16px;
      text-decoration: none; color: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    .study-row:hover {
      border-color: var(--green-m);
      box-shadow: 0 2px 12px rgba(59,124,79,.06);
    }
    .study-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .study-info { flex: 1; min-width: 0; }
    .study-title {
      font-size: 14px; font-weight: 600; color: var(--ink);
      margin-bottom: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .study-meta { font-size: 12px; color: var(--ink3); }

    .study-prog { width: 110px; flex-shrink: 0; }
    .prog-track { height: 3px; background: var(--bg3); border-radius: 2px; overflow: hidden; margin-bottom: 4px; }
    .prog-fill  { height: 100%; border-radius: 2px; background: var(--green); }
    .prog-label { font-size: 11px; color: var(--ink3); text-align: right; }

    .study-badge {
      font-size: 11px; font-weight: 600; padding: 3px 10px;
      border-radius: 20px; flex-shrink: 0;
    }
    .badge-published { background: var(--green-l); color: var(--green); }
    .badge-draft     { background: #fef3c7; color: #92400e; }
    .badge-closed    { background: var(--bg3); color: var(--ink3); }

    .study-arrow {
      font-size: 12px; color: var(--ink4); flex-shrink: 0;
      transition: transform .15s, color .15s;
    }
    .study-row:hover .study-arrow { color: var(--green); transform: translateX(2px); }

    /* ── EMPTY ── */
    .empty { text-align: center; padding: 80px 20px; }
    .empty-title { font-family: var(--serif); font-size: 22px; color: var(--ink); margin-bottom: 8px; }
    .empty-sub { font-size: 14px; color: var(--ink3); font-weight: 300; margin-bottom: 24px; }

    /* ── GUIDED TOUR ── */
    body.tour-active { overflow: hidden; }
    .tour-backdrop {
      display: none; position: fixed; inset: 0; z-index: 900;
      background: rgba(26,26,24,.54); backdrop-filter: blur(3px);
    }
    .tour-backdrop.open { display: block; }
    .tour-spotlight {
      display: none; position: fixed; z-index: 925; pointer-events: none;
      border: 2px solid var(--green); border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.9);
      transition: left .18s ease, top .18s ease, width .18s ease, height .18s ease;
    }
    .tour-spotlight.open { display: block; }
    .tour-highlight {
      position: relative; z-index: 926 !important;
      filter: saturate(1.1) brightness(1.04);
    }
    .tour-lift { z-index: 924 !important; }
    .tour-card {
      display: none; position: fixed; z-index: 930;
      width: min(340px, calc(100vw - 32px)); background: var(--bg);
      border: .5px solid var(--line2); border-radius: 12px;
      box-shadow: 0 20px 60px rgba(26,26,24,.2); padding: 18px 20px;
      max-height: calc(100dvh - 32px); overflow-y: auto;
    }
    .tour-card.open { display: block; }
    .tour-step { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--green); margin-bottom: 7px; }
    .tour-title { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 6px; letter-spacing: -.2px; }
    .tour-body { font-size: 14px; color: var(--ink2); line-height: 1.65; margin-bottom: 16px; }
    .tour-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .tour-btn { border: .5px solid var(--line2); background: var(--bg); color: var(--ink2); border-radius: 8px; padding: 8px 13px; font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; }
    .tour-btn:hover { background: var(--bg3); }
    .tour-btn.primary { border-color: var(--green); background: var(--green); color: #fff; }
    .tour-btn.primary:hover { background: var(--green-d); }
    .tour-btn:disabled { opacity: .35; cursor: default; }
    /* ive added this so users can skip the tour — quiet text button on the left */
    .tour-btn.tour-skip { border: none; background: transparent; color: var(--ink3); padding-left: 0; }
    .tour-btn.tour-skip:hover { background: transparent; color: var(--ink); text-decoration: underline; }
    .tour-nav-group { display: flex; gap: 8px; }

    /* ── NEW LISTING MODAL ── */
    .modal-bg {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: rgba(26,26,24,.38); backdrop-filter: blur(10px);
      align-items: center; justify-content: center; padding: 24px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--bg); border-radius: 14px;
      border: 0.5px solid var(--line2); width: 100%; max-width: 680px;
      box-shadow: 0 22px 70px rgba(26,26,24,.16);
      animation: modal-in .18s ease; overflow: hidden;
    }
    @keyframes modal-in { from { transform: translateY(10px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
    .modal-head {
      padding: 24px 26px 20px; border-bottom: 0.5px solid var(--line);
      display: flex; align-items: flex-start; justify-content: space-between;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    }
    .modal-kicker { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--green); margin-bottom: 6px; }
    .modal-title { font-family: var(--sans); font-size: 22px; font-weight: 300; color: var(--ink); letter-spacing: -.4px; margin-bottom: 5px; }
    .modal-title strong { font-weight: 700; }
    .modal-sub   { font-size: 13px; color: var(--ink3); line-height: 1.55; max-width: 440px; }
    .modal-close { width: 30px; height: 30px; border-radius: 8px; background: var(--bg); border: .5px solid var(--line); cursor: pointer; color: var(--ink3); display: flex; align-items: center; justify-content: center; transition: all .12s; }
    .modal-close:hover { color: var(--ink); background: var(--bg3); border-color: var(--line2); }
    .modal-close svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; }
    .modal-body  { padding: 22px 26px 26px; }
    .listing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .listing-form { margin: 0; min-width: 0; }
    .listing-type {
      position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
      min-height: 168px; padding: 18px; background: var(--bg); border: 0.5px solid var(--line);
      border-radius: 12px; cursor: pointer; text-decoration: none; color: inherit;
      font-family: var(--sans); width: 100%; text-align: left;
      transition: border-color .15s, background .15s, transform .15s, box-shadow .15s;
    }
    .listing-type:hover { border-color: var(--green-m); background: var(--green-l); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(59,124,79,.08); }
    .listing-type.primary { border-color: var(--green-m); box-shadow: inset 0 0 0 1px rgba(59,124,79,.06); }
    .listing-type.wide { min-height: 88px; margin-top: 12px; display: grid; grid-template-columns: auto minmax(0,1fr) auto auto; align-items: center; gap: 14px; }
    .lt-icon {
      width: 38px; height: 38px; border-radius: 9px;
      background: var(--bg3); display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .listing-type.primary .lt-icon { background: var(--green-l); }
    .lt-icon svg { width: 16px; height: 16px; stroke: var(--green); fill: none; stroke-width: 2; }
    .lt-content { min-width: 0; }
    .lt-title { font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 5px; letter-spacing: -.1px; }
    .lt-desc  { font-size: 12px; color: var(--ink3); line-height: 1.55; }
    .lt-tag { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 999px; background: var(--bg3); color: var(--ink3); font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-top: auto; }
    .listing-type.primary .lt-tag { background: var(--green-l); color: var(--green); }
    .lt-arrow { position: absolute; right: 16px; top: 18px; font-size: 14px; color: var(--ink4); flex-shrink: 0; transition: transform .15s, color .15s; }
    .listing-type.wide .lt-arrow { position: static; }
    .listing-type:hover .lt-arrow { transform: translateX(2px); color: var(--green); }
    @media (max-width: 680px) {
      body { display: block; }
      .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: .5px solid var(--line); }
      .sidebar-logo { padding: 14px 16px; }
      .sidebar-nav { flex-direction: row; overflow-x: auto; padding: 8px; gap: 4px; }
      .sidebar-nav::-webkit-scrollbar { height: 3px; }
      .nav-item { width: auto; flex-shrink: 0; white-space: nowrap; }
      .nav-divider, .sidebar-user { display: none; }
      .topbar { padding: 10px 16px; height: auto; min-height: 56px; gap: 8px; flex-wrap: wrap; }
      .content { padding: 20px 16px; }
      .stat-item { padding: 16px 10px; }
      .stat-n { font-size: 24px; }
      .type-tabs { flex-wrap: wrap; }
      .study-row { padding: 16px; gap: 10px; flex-wrap: wrap; }
      .study-info { flex: 1 1 140px; }
      .study-prog { width: 100%; order: 1; }
      .study-arrow { display: none; }
      .modal { max-width: 440px; }
      .listing-grid { grid-template-columns: 1fr; }
      .listing-type { min-height: 132px; }
      .listing-type.wide { display: flex; min-height: 132px; }
      .listing-type.wide .lt-arrow { position: absolute; right: 16px; top: 18px; }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 2px; }
  </style>
