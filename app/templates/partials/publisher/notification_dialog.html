<!-- NOTIFICATION MODAL -->
<div id="notifOverlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:9999; align-items:center; justify-content:center;" onclick="closeNotifModal(event)">
  <div id="notifModal" style="background:#fff; border-radius:18px; width:720px; max-width:94vw; height:90vh; display:flex; flex-direction:column; box-shadow:0 24px 64px rgba(0,0,0,0.22); overflow:hidden;" onclick="event.stopPropagation()">
    <div style="padding:20px 24px 16px; border-bottom:1px solid #e8e8e8; display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; align-items:center; gap:10px;">
        <span style="font-size:20px;">🔔</span>
        <h3 style="font-size:17px; font-weight:700; margin:0;">Notifications</h3>
        <span id="notifCount" style="font-size:12px; color:#888;"></span>
      </div>
      <button onclick="closeNotifModal()" style="background:none; border:none; font-size:22px; cursor:pointer; color:#aaa; line-height:1; padding:2px 6px;">✕</button>
    </div>
    <div class="notif-list" id="notifList" style="overflow-y:auto; flex:1; padding:12px 0;">
      <div class="notif-empty">Loading...</div>
    </div>
  </div>
</div>
