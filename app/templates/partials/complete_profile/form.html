    <form method="POST" action="/complete-profile">
      <input type="hidden" name="next" value="{{ next or '' }}">
      <input type="hidden" name="role" value="{{ role or '' }}">
      <div class="row">
        <div class="field">
          <label>First name</label>
          <input name="first_name" autocomplete="given-name" required value="{{ current_user.first_name or '' }}">
        </div>
        <div class="field">
          <label>Last name</label>
          <input name="last_name" autocomplete="family-name" required value="{{ current_user.last_name or '' }}">
        </div>
      </div>
      <div class="field">
        <label>Username</label>
        <input name="username" autocomplete="nickname" required value="{{ current_user.username or '' }}" placeholder="How you want to appear in Insighta">
      </div>
      <div class="row">
        <div class="field">
          <label>Birth year</label>
          <input type="number" min="1900" max="2010" name="birth_year" required value="{{ current_user.birth_year or '' }}" placeholder="2002">
        </div>
        <div class="field">
          <label>Birth month</label>
          <select name="birth_month" required>
            <option value="">Select</option>
            {% for month in ['January','February','March','April','May','June','July','August','September','October','November','December'] %}
              <option value="{{ loop.index }}" {% if current_user.birth_month|string == loop.index|string %}selected{% endif %}>{{ month }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="field">
        <label>Education level</label>
        <select name="education_level" required>
          <option value="">Select education level</option>
          {% for option in ['Below High School','High School','Undergraduate','Graduate','PhD','Postdoc'] %}
            <option value="{{ option }}" {% if current_user.education_level == option %}selected{% endif %}>{{ option }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>Field / major</label>
        <select name="field" required>
          <option value="">Select field / major</option>
          {% for option in ['Computer Science & Engineering','Data Science / AI','Business & Economics','Marketing / Design','Medicine & Healthcare','Psychology / Neuroscience','Natural Sciences','Social Sciences','Education','Law / Public Policy','Arts & Humanities','Communications / Media','Architecture / Design','Other'] %}
            <option value="{{ option }}" {% if current_user.field == option %}selected{% endif %}>{{ option }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>Current status</label>
        <select name="status" required>
          <option value="">Select current status</option>
          {% for option in ['High school student','Undergraduate student','Graduate student','PhD student','Postdoc','Full-time employed','Part-time employed','Self-employed / Freelancer','Unemployed','Homemaker / Caregiver','Retired','Other'] %}
            <option value="{{ option }}" {% if current_user.status == option %}selected{% endif %}>{{ option }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label>State you live in now</label>
        <select name="current_province" required>
          <option value="">Select state</option>
          {% for option in ['Alabama','Alaska','Arizona','Arkansas','California','Colorado','Connecticut','Delaware','Florida','Georgia','Hawaii','Idaho','Illinois','Indiana','Iowa','Kansas','Kentucky','Louisiana','Maine','Maryland','Massachusetts','Michigan','Minnesota','Mississippi','Missouri','Montana','Nebraska','Nevada','New Hampshire','New Jersey','New Mexico','New York','North Carolina','North Dakota','Ohio','Oklahoma','Oregon','Pennsylvania','Rhode Island','South Carolina','South Dakota','Tennessee','Texas','Utah','Vermont','Virginia','Washington','Washington DC','West Virginia','Wisconsin','Wyoming','Other'] %}
            <option value="{{ option }}" {% if (current_user.current_province or current_user.state) == option %}selected{% endif %}>{{ option }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="row">
        <div class="field">
          <label>Primary language</label>
          <select name="language" required>
            <option value="">Select language</option>
            {% for option in ['English','Spanish','Mandarin Chinese','Cantonese','French','Arabic','Hindi','Bengali','Portuguese','Russian','Japanese','Korean','German','Italian','Vietnamese','Tagalog','Urdu','Other'] %}
              <option value="{{ option }}" {% if current_user.language == option %}selected{% endif %}>{{ option }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="field">
          <label>Participation preference</label>
          <select name="participation_format" required>
            <option value="">Select format</option>
            {% for option in ['Online surveys','Phone interview','Video interview','In-person study','Product test','Diary study','Any format'] %}
              <option value="{{ option }}" {% if current_user.participation_format == option %}selected{% endif %}>{{ option }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <button class="submit" type="submit">Continue</button>
    </form>
