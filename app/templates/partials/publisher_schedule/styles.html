<style>
    :root{--green:#3b7c4f;--green-l:#e8f2eb;--green-m:#c2deca;--ink:#1a1a18;--ink2:#4a4a44;--ink3:#8a8a82;--bg:#fff;--bg2:#fafaf8;--bg3:#f5f3ee;--line:#eeece6;--line2:#e0ddd6;--sans:'DM Sans',system-ui,sans-serif;--sidebar:220px;}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--bg2);color:var(--ink);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased}
    .sidebar{width:var(--sidebar);flex-shrink:0;background:var(--bg);border-right:.5px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
    .sidebar-logo{padding:20px 20px 18px;border-bottom:.5px solid var(--line);font-size:15px;font-weight:600;color:var(--ink);text-decoration:none;display:block}.sidebar-logo span{color:var(--green)}
    .sidebar-nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:1px}.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink3);text-decoration:none}.nav-item:hover{background:var(--bg3);color:var(--ink2)}.nav-item.active{background:var(--green-l);color:var(--green);font-weight:600}.nav-item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.nav-divider{height:.5px;background:var(--line);margin:6px 10px}
    .sidebar-user{padding:14px 10px;border-top:.5px solid var(--line)}.user-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;text-decoration:none}.user-row:hover{background:var(--bg3)}.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--green);color:white;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}.user-name{font-size:13px;font-weight:600;color:var(--ink)}.user-email{font-size:11px;color:var(--ink3)}
    .main{flex:1;min-width:0}.topbar{height:56px;padding:0 32px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}.topbar-title{font-size:15px;font-weight:700}.btn-new{background:var(--green);color:#fff;border:none;border-radius:8px;padding:9px 14px;text-decoration:none;font-size:13px;font-weight:700}
    .content{padding:28px 32px;max-width:980px}.page-head{margin-bottom:22px}.page-head h1{font-size:30px;font-weight:300;letter-spacing:-.7px;margin-bottom:6px}.page-head h1 strong{font-weight:800}.page-head p{font-size:14px;color:var(--ink3);line-height:1.6;max-width:620px}
    .schedule-list{display:grid;gap:16px}.study-card{background:var(--bg);border:.5px solid var(--line);border-radius:12px;overflow:hidden}.study-head{padding:18px 20px;border-bottom:.5px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.study-title{font-size:16px;font-weight:800;margin-bottom:4px}.study-meta{font-size:12px;color:var(--ink3)}.study-actions{display:flex;gap:8px;flex-wrap:wrap}.mini-btn{border:.5px solid var(--line2);background:var(--bg);border-radius:7px;padding:7px 10px;color:var(--ink2);font-size:12px;font-weight:700;text-decoration:none}.mini-btn:hover{background:var(--green-l);border-color:var(--green-m);color:var(--green)}
    .schedule-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.8fr);gap:0}.slot-pane,.booking-pane{padding:16px 20px}.slot-pane{border-right:.5px solid var(--line)}.section-label{font-size:11px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}.slot-list{display:flex;flex-wrap:wrap;gap:8px}.slot-chip{border:.5px solid var(--green-m);background:var(--green-l);color:var(--green);border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}.slot-chip.booked{border-color:var(--line2);background:var(--bg3);color:var(--ink3);text-decoration:line-through}.booking-list{display:grid;gap:8px}.booking-row{border:.5px solid var(--line);background:var(--bg2);border-radius:9px;padding:10px 12px}.booking-person{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:3px}.booking-slot{font-size:12px;color:var(--ink2);line-height:1.45}.booking-status{font-size:11px;color:var(--green);font-weight:800;margin-top:5px;text-transform:uppercase}.booking-complete{margin-top:9px;border:0;border-radius:7px;background:var(--green);color:#fff;padding:7px 10px;font:700 11px var(--sans);cursor:pointer}.booking-complete:disabled{background:var(--line2);color:var(--ink3);cursor:default}.empty{border:.5px dashed var(--line2);background:var(--bg);border-radius:10px;padding:28px;text-align:center;color:var(--ink3);font-size:14px}
    @media(max-width:820px){.sidebar{display:none}.content{padding:22px 18px}.schedule-grid{grid-template-columns:1fr}.slot-pane{border-right:none;border-bottom:.5px solid var(--line)}}
  </style>
