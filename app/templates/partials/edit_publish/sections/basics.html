    <!-- 01 BASIC INFO -->
    <div class="form-section">
      <div class="section-head">
        <div class="section-num">01</div>
        <div>
          <div class="section-title">Basic information</div>
          <div class="section-sub">Title, description{% if survey.form_url != '__builtin__' %}, and form link{% endif %}</div>
        </div>
      </div>
      <div class="field">
        <label>Title <span style="color:var(--red)">*</span></label>
        <input type="text" name="title" value="{{ survey.title }}" required>
      </div>
      <div class="field">
        <label>Description <span style="color:var(--red)">*</span></label>
        <textarea name="description" required>{{ survey.description }}</textarea>
      </div>
      {% if survey.form_url == '__builtin__' %}
        <input type="hidden" name="form_url" value="__builtin__">
        <div class="builtin-box">
          <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          <div class="builtin-box-text">
            <strong>Insighta built-in survey</strong>
            Questions are managed in the builder. No external link needed.
          </div>
        </div>
      {% else %}
      <div class="field">
        <label>Form link <span style="color:var(--red)">*</span></label>
        <input type="url" name="form_url" value="{{ survey.form_url }}" required>
      </div>
      {% endif %}
    </div>
