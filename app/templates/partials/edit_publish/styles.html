<style>
    :root {
      --green:#3b7c4f; --green-d:#2a5c39; --green-l:#e8f2eb; --green-m:#c2deca;
      --ink:#1a1a18; --ink2:#4a4a44; --ink3:#8a8a82; --ink4:#b8b8b0;
      --bg:#ffffff; --bg2:#fafaf8; --bg3:#f5f3ee;
      --line:#eeece6; --line2:#e0ddd6;
      --red:#ef4444; --red-l:#fff5f5; --red-b:#fecaca;
      --serif:'DM Serif Display',Georgia,serif;
      --sans:'DM Sans',system-ui,sans-serif;
      --sidebar:220px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:var(--sans);background:var(--bg2);color:var(--ink);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;}

    /* ── SIDEBAR ── */
    .sidebar{width:var(--sidebar);flex-shrink:0;background:var(--bg);border-right:0.5px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
    .sidebar-logo{padding:20px 20px 18px;border-bottom:0.5px solid var(--line);font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-0.2px;text-decoration:none;display:block;}
    .sidebar-logo span{color:var(--green);}
    .sidebar-nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:1px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink3);text-decoration:none;cursor:pointer;border:none;background:none;font-family:var(--sans);width:100%;text-align:left;transition:background .12s,color .12s;}
    .nav-item:hover{background:var(--bg3);color:var(--ink2);}
    .nav-item.active{background:var(--green-l);color:var(--green);font-weight:600;}
    .nav-item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
    .nav-divider{height:0.5px;background:var(--line);margin:6px 10px;}
    .sidebar-user{padding:14px 10px;border-top:0.5px solid var(--line);}
    .user-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;text-decoration:none;transition:background .12s;}
    .user-row:hover{background:var(--bg3);}
    .user-avatar{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
    .user-name{font-size:13px;font-weight:500;color:var(--ink);}
    .user-email{font-size:11px;color:var(--ink3);margin-top:1px;}

    /* ── MAIN ── */
    .main{flex:1;min-width:0;display:flex;flex-direction:column;}
    .topbar{height:56px;padding:0 32px;background:rgba(255,255,255,0.92);backdrop-filter:blur(16px);border-bottom:0.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:50;}
    .topbar-left{display:flex;align-items:center;gap:14px;min-width:0;}
    .topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
    .back-btn{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink3);text-decoration:none;font-weight:500;transition:color .12s;flex-shrink:0;}
    .back-btn:hover{color:var(--ink);}
    .back-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
    .topbar-sep{width:0.5px;height:16px;background:var(--line);flex-shrink:0;}
    .topbar-title{font-size:15px;font-weight:600;color:var(--ink);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    /* ── CONTENT ── */
    .content{padding:36px 32px 80px;width:100%;max-width:1040px;margin:0 auto;}
    .page-header{margin-bottom:28px;}
    .page-kicker{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:8px;}
    .page-header h1{font-size:32px;font-weight:300;color:var(--ink);letter-spacing:-.6px;margin-bottom:7px;}
    .page-header h1 strong{font-weight:700;}
    .page-header p{font-size:14px;color:var(--ink3);line-height:1.6;max-width:560px;}

    /* ── FORM SECTIONS ── */
    .form-section{background:var(--bg);border:0.5px solid var(--line);border-radius:10px;padding:22px 24px;margin-bottom:14px;}
    .section-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:0.5px solid var(--line);}
    .section-num{width:26px;height:26px;border-radius:6px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink3);flex-shrink:0;margin-top:1px;}
    .section-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px;}
    .section-sub{font-size:12px;color:var(--ink3);}

    /* ── FIELDS ── */
    .field{margin-bottom:16px;}
    .field:last-child{margin-bottom:0;}
    .field label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px;}
    .field-hint{font-size:11px;color:var(--ink3);margin-bottom:5px;margin-top:-2px;}
    .field input,.field textarea,.field select{width:100%;border:0.5px solid var(--line2);border-radius:7px;padding:9px 12px;font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--bg2);transition:border-color .15s,background .15s;}
    .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--green);background:var(--bg);}
    .field input::placeholder,.field textarea::placeholder{color:var(--ink4);}
    .field textarea{resize:vertical;min-height:80px;line-height:1.6;}
    .field select{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='11' height='7' viewBox='0 0 11 7' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L5.5 6L10 1' stroke='%238a8a82' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;background-color:var(--bg2);padding-right:32px;}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .row .field{margin-bottom:0;}
    .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
    .row-3 .field{margin-bottom:0;}

    /* ── INFO BOXES ── */
    .info-box{background:var(--green-l);border-left:2.5px solid var(--green);padding:11px 14px;border-radius:0 7px 7px 0;font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:16px;}
    .info-box strong{display:block;font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
    .warn-box{background:#fffbeb;border-left:2.5px solid var(--amber,#f59e0b);padding:11px 14px;border-radius:0 7px 7px 0;font-size:13px;color:var(--ink2);line-height:1.6;margin-bottom:16px;}
    .warn-box strong{display:block;font-size:11px;font-weight:700;color:#c05621;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px;}
    .builtin-box{display:flex;align-items:flex-start;gap:12px;background:var(--green-l);border:0.5px solid var(--green-m);border-radius:8px;padding:12px 14px;margin-bottom:16px;}
    .builtin-box svg{width:16px;height:16px;stroke:var(--green);fill:none;stroke-width:2;flex-shrink:0;margin-top:1px;}
    .builtin-box-text{font-size:13px;color:var(--ink2);line-height:1.6;}
    .builtin-box-text strong{font-weight:600;color:var(--green);display:block;margin-bottom:1px;}

    /* ── PROGRESS BAR ── */
    .progress-card{background:var(--bg3);border:0.5px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;}
    .progress-label{font-size:12px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;}
    .progress-value{font-size:18px;font-weight:300;color:var(--green);letter-spacing:-0.5px;}

    /* ── AUTO FILTER ── */
    .filter-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
    .filter-toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;}
    .filter-toggle input{width:15px;height:15px;accent-color:var(--green);}
    .filter-score{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);}
    .filter-score.disabled{color:var(--ink3);}
    .filter-score input{width:70px;padding:6px 10px;border:0.5px solid var(--line2);border-radius:6px;font-family:var(--sans);font-size:13px;font-weight:600;text-align:center;background:var(--bg2);}
    .filter-score input:disabled{background:var(--bg3);cursor:not-allowed;}
    .tips-box{background:var(--bg3);border-left:2.5px solid var(--green);padding:12px 14px;border-radius:0 7px 7px 0;font-size:12px;color:var(--ink2);line-height:1.7;}
    .tips-box strong{display:block;font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
    .tips-box ul{margin-left:16px;}
    .tips-box li{margin-bottom:3px;}
    .tips-box .rec{font-weight:600;color:var(--ink);}

    /* ── SUB LABELS ── */
    .sub-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding:14px 0 8px;border-top:0.5px solid var(--line);margin-top:4px;}
    .sub-label:first-of-type{border-top:none;padding-top:0;margin-top:0;}
    .pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px;}
    .pill{padding:7px 16px;border:.5px solid var(--line2);border-radius:20px;font-size:13px;font-weight:500;color:var(--ink3);cursor:pointer;transition:all .12s;user-select:none;}
    .pill:hover{border-color:var(--green-m);color:var(--ink2);}
    .pill.active{border-color:var(--green);background:var(--green-l);color:var(--green);font-weight:600;}

    /* ── CHECKBOXES ── */
    .check-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px;}
    .check-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border:0.5px solid var(--line);border-radius:7px;cursor:pointer;font-size:12px;color:var(--ink2);transition:all .12s;}
    .check-item:hover{border-color:var(--green-m);background:var(--green-l);}
    .check-item.checked{border-color:var(--green);background:var(--green-l);color:var(--ink);}
    .check-item input{accent-color:var(--green);width:13px;height:13px;flex-shrink:0;}

    /* ── VERIFICATION: occupation multiselect dropdown (ive restyled this) ── */
    .occ-dd{position:relative;}
    .occ-dd-btn{width:100%;min-height:44px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:.5px solid var(--line2);border-radius:9px;font-family:var(--sans);font-size:13px;color:var(--ink);cursor:pointer;text-align:left;transition:border-color .15s;}
    .occ-dd-btn:hover{border-color:var(--green-m);}
    .occ-dd.open .occ-dd-btn{border-color:var(--green);}
    .occ-dd-btn .chev{width:14px;height:14px;stroke:var(--ink3);fill:none;stroke-width:2;flex-shrink:0;transition:transform .15s;}
    .occ-dd.open .chev{transform:rotate(180deg);}
    .occ-dd-count{font-size:11px;font-weight:700;color:var(--green);background:var(--green-l);border:.5px solid var(--green-m);padding:1px 8px;border-radius:100px;margin-left:8px;flex-shrink:0;}
    .occ-dd-panel{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;background:var(--bg);border:.5px solid var(--line2);border-radius:10px;box-shadow:0 12px 32px rgba(26,26,24,.14);max-height:300px;overflow-y:auto;padding:6px;}
    .occ-dd.open .occ-dd-panel{display:block;}
    .occ-dd-group{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding:10px 10px 4px;}
    .occ-dd-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--ink2);cursor:pointer;transition:background .1s;}
    .occ-dd-item:hover{background:var(--bg3);}
    .occ-dd-item.on{color:var(--ink);font-weight:600;}
    .occ-dd-item input{accent-color:var(--green);width:14px;height:14px;flex-shrink:0;}


    /* ── ADVANCED ── */
    details>summary{list-style:none;}
    details>summary::-webkit-details-marker{display:none;}
    .adv-toggle{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer;padding:12px 0;border-top:0.5px solid var(--line);margin-top:4px;user-select:none;}
    .adv-toggle:hover{color:var(--ink2);}
    .adv-toggle svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;transition:transform .2s;}
    details[open] .adv-toggle svg{transform:rotate(90deg);}
    .adv-body{padding-top:14px;display:flex;flex-direction:column;gap:12px;}

    /* ── FILE ZONE ── */
    .file-zone{border:0.5px dashed var(--line2);border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;position:relative;}
    .file-zone:hover{border-color:var(--green);background:var(--green-l);}
    .file-zone input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
    .fz-icon{width:28px;height:28px;border-radius:7px;background:var(--bg3);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;}
    .fz-icon svg{width:14px;height:14px;stroke:var(--ink3);fill:none;stroke-width:2;}
    .fz-text{font-size:12px;color:var(--ink3);}
    .fz-text strong{color:var(--ink2);}
    .fz-name{font-size:11px;color:var(--green);font-weight:600;margin-top:5px;display:none;}
    .current-img{margin-top:8px;font-size:11px;color:var(--ink3);background:var(--bg3);border-radius:5px;padding:5px 9px;display:inline-block;}

    /* ── SUBMIT BAR ── */
    .submit-bar{background:var(--bg);border:0.5px solid var(--line);border-radius:10px;padding:18px 24px;display:flex;align-items:center;justify-content:flex-end;gap:10px;}
    .btn-cancel{padding:9px 18px;background:transparent;color:var(--ink3);border:0.5px solid var(--line2);border-radius:7px;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:all .12s;}
    .btn-cancel:hover{background:var(--bg3);color:var(--ink2);}
    .btn-save{padding:9px 22px;background:var(--green);color:#fff;border:none;border-radius:7px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:background .12s;display:flex;align-items:center;gap:6px;}
    .btn-save:hover{background:var(--green-d);}
    .btn-save svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:2.5;}

    @media(max-width:700px){
      .sidebar{display:none;}
      .content{padding:20px 16px 56px;}
      .row,.row-3{grid-template-columns:1fr;}
      .check-grid{grid-template-columns:1fr;}
      .submit-bar{flex-direction:column-reverse;}
      .btn-cancel,.btn-save{width:100%;justify-content:center;}
    }
  </style>
