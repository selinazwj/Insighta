      <section class="profile-section">
        <div class="section-header">
          <div class="sh-icon" style="background:var(--yale);"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/></svg></div>
          <div class="sh-title">Languages</div>
        </div>
        <div class="section-body">
          <div class="chip-grid">
            {% for option in ['English','Spanish','Mandarin Chinese','Cantonese','French','Arabic','Hindi','Bengali','Portuguese','Russian','Japanese','Korean','German','Italian','Vietnamese','Tagalog','Urdu','Turkish','Persian','Other'] %}
              <label class="chip"><input type="checkbox" name="language" value="{{ option }}" {% if option in languages %}checked{% endif %} {% if option == 'Other' %}data-other-source data-other-target="language-other"{% endif %}><span>{{ option }}</span></label>
            {% endfor %}
          </div>
          <label class="form-group other-input" id="language-other" style="margin-top:12px;"><span class="form-label">Other language</span><input class="form-input" name="language_other" value="{{ language_other }}" placeholder="Type another language"></label>
        </div>
      </section>
