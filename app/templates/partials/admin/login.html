<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>Admin Console</h1>
    <p>Enter the admin key to access feedback, support, and channel discovery tools.</p>
    <input type="password" id="adminKeyInput" placeholder="Admin key" onkeydown="if(event.key==='Enter') login()">
    <button onclick="login()">Sign in</button>
    <div class="login-error" id="loginError">Invalid admin key</div>
  </div>
</div>
