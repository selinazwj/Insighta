<style>
    :root {
      --green:#3b7c4f; --green-d:#2a5c39; --green-l:#e8f2eb; --green-m:#c2deca;
      --ink:#1a1a18; --ink-soft:#4a4a44; --ink-muted:#8a8a82; --ink4:#b8b8b0;
      --paper:#fafaf8; --paper-warm:#f5f3ee; --bg:#ffffff;
      --accent:#3b7c4f; --accent-light:#c2deca; --accent-warm:#c05621;
      --line:#eeece6; --line2:#e0ddd6;
      --serif: 'DM Serif Display', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
      --sidebar: 220px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; -webkit-font-smoothing: antialiased; }

    .sidebar{width:var(--sidebar);flex-shrink:0;background:var(--bg);border-right:.5px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
    .sidebar-logo{padding:20px 20px 18px;border-bottom:.5px solid var(--line);font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-0.2px;text-decoration:none;display:block;}
    .sidebar-logo span{color:var(--green);}
    .sidebar-nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:1px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-muted);text-decoration:none;border:none;background:none;font-family:var(--sans);width:100%;text-align:left;transition:background .12s,color .12s;}
    .nav-item:hover{background:var(--paper-warm);color:var(--ink-soft);}
    .nav-item.active{background:var(--green-l);color:var(--green);font-weight:600;}
    .nav-item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
    .nav-divider{height:.5px;background:var(--line);margin:6px 10px;}
    .sidebar-user{padding:14px 10px;border-top:.5px solid var(--line);}
    .user-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;text-decoration:none;transition:background .12s;}
    .user-row:hover{background:var(--paper-warm);}
    .avatar{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
    .user-name{font-size:13px;font-weight:500;color:var(--ink);}
    .user-email{font-size:11px;color:var(--ink-muted);margin-top:1px;}
    .main{flex:1;min-width:0;display:flex;flex-direction:column;}
    .topbar{height:56px;padding:0 32px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:80;gap:14px;}
    .topbar-left{display:flex;align-items:center;gap:12px;min-width:0;}
    .back-btn{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-muted);text-decoration:none;font-weight:500;transition:color .12s;flex-shrink:0;}
    .back-btn:hover{color:var(--ink);}
    .back-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
    .topbar-sep{width:.5px;height:16px;background:var(--line);flex-shrink:0;}
    .topbar-title{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}

    .container { width: 100%; max-width: 1040px; margin: 0 auto; padding: 36px 32px 80px; }

    .page-header { margin-bottom: 32px; }
    .type-badge { display: inline-flex; align-items: center; gap: 8px; color: var(--green); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
    .page-header h1 { font-family: var(--sans); font-size: 32px; font-weight: 300; color: var(--ink); letter-spacing: -.6px; margin-bottom: 7px; }
    .page-header h1 em { font-style: normal; font-weight: 700; color: var(--ink); }
    .page-header p { font-size: 14px; color: var(--ink-muted); line-height: 1.6; max-width: 560px; }

    .form-section { background: var(--bg); border: .5px solid var(--line); border-radius: 12px; padding: 26px 28px; margin-bottom: 16px; }
    [data-wizard-step][hidden] { display: none !important; }
    .wizard-progress { background:var(--bg); border:.5px solid var(--line); border-radius:12px; padding:18px 20px; margin-bottom:16px; }
    .wizard-progress-top { display:flex; justify-content:space-between; gap:12px; margin-bottom:12px; font-size:14px; font-weight:700; color:var(--ink); }
    .wizard-progress-top span:last-child { color:var(--green); font-size:12px; }
    .wizard-track { height:7px; border-radius:999px; background:var(--paper-warm); overflow:hidden; }
    .wizard-fill { width:20%; height:100%; border-radius:inherit; background:var(--green); transition:width .22s ease; }
    .wizard-labels { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:10px; }
    .wizard-label { text-align:center; font-size:11px; font-weight:600; color:var(--ink-muted); }
    .wizard-label.active { color:var(--green); }
    .wizard-nav { background:var(--bg); border:.5px solid var(--line); border-radius:12px; padding:16px 20px; display:flex; align-items:center; gap:12px; margin-bottom:16px; }
    .wizard-note { flex:1; text-align:center; font-size:12px; color:var(--ink-muted); }
    .btn-step { padding:10px 20px; border-radius:8px; font-family:var(--sans); font-size:14px; font-weight:600; cursor:pointer; }
    .btn-step.back { background:var(--bg); color:var(--ink-muted); border:.5px solid var(--line2); }
    .btn-step.next { background:var(--green); color:white; border:0; }
    .section-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 22px; padding-bottom: 18px; border-bottom: .5px solid var(--line); }
    .section-icon { width: 28px; height: 28px; border-radius: 7px; background: var(--paper-warm); color: var(--ink-muted); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px; }
    .section-header h2 { font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: 0; }
    .section-header p { font-size: 12px; color: var(--ink-muted); font-weight: 400; margin-top: 2px; }

    .info-box { background: rgba(45,106,79,0.06); border-left: 3px solid var(--accent); padding: 14px 18px; border-radius: 0 8px 8px 0; font-size: 14px; color: var(--ink-soft); margin-bottom: 24px; line-height: 1.6; }
    .info-box strong { display: block; color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 4px; }

    .form-group { margin-bottom: 20px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
    .label-desc { font-size: 12px; color: var(--ink-muted); font-weight: 300; margin-top: 2px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; border: .5px solid var(--line2); border-radius: 8px; font-family: var(--sans); font-size: 14px; color: var(--ink); background: var(--paper); transition: border-color .15s, background .15s; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--green); background: var(--bg); box-shadow: none; }
    .form-group input::placeholder, .form-group textarea::placeholder { color: #c4c2bc; font-weight: 300; }
    .form-group textarea { resize: vertical; min-height: 96px; line-height: 1.6; }
    .form-group select { appearance: none; background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%234a4a44' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E"); background-repeat: no-repeat; background-position: right 14px center; padding-right: 36px; cursor: pointer; color: #c4c2bc; }
    .form-group select.has-value { color: var(--ink); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    .form-row .form-group, .form-row-3 .form-group { margin-bottom: 0; }

    .format-pills { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .format-pill { padding: 7px 16px; border: .5px solid var(--line2); border-radius: 100px; font-size: 13px; font-weight: 500; color: var(--ink-muted); cursor: pointer; transition: all 0.15s; user-select: none; }
    .format-pill:hover { border-color: var(--accent-light); color: var(--ink); }
    .format-pill.selected { border-color: var(--green); background: var(--green-l); color: var(--green); font-weight: 600; }

    .incentive-pills { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .incentive-pill { padding: 7px 16px; border: .5px solid var(--line2); border-radius: 100px; font-size: 13px; font-weight: 500; color: var(--ink-muted); cursor: pointer; transition: all 0.15s; user-select: none; }
    .incentive-pill:hover { border-color: var(--accent-light); color: var(--ink); }
    .incentive-pill.selected { border-color: var(--accent); background: rgba(45,106,79,0.08); color: var(--accent); }

    .urgency-pills { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .urgency-pill { padding: 7px 16px; border: .5px solid var(--line2); border-radius: 100px; font-size: 13px; font-weight: 500; color: var(--ink-muted); cursor: pointer; transition: all 0.15s; user-select: none; }
    .urgency-pill:hover { border-color: var(--accent-light); color: var(--ink); }
    .urgency-pill.selected { border-color: var(--green); background: var(--green-l); color: var(--green); font-weight: 600; }
    .urgency-pill.urgent.selected { border-color: #c05621; background: #c05621; }

    .commission-box { display: none; margin-top: 16px; background: white; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
    .commission-row { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .commission-row:last-child { border-bottom: none; background: rgba(45,106,79,0.04); }
    .commission-row .clabel { font-size: 13px; color: var(--ink-muted); }
    .commission-row .cvalue { font-weight: 600; color: var(--ink); }
    .commission-row .cvalue.green { color: var(--accent); }
    .commission-row .cvalue.orange { color: var(--accent-warm); }
    .commission-row .cvalue.total { font-family: var(--serif); font-size: 22px; color: var(--accent); }

    .raffle-box { display: none; margin-top: 16px; background: rgba(45,106,79,0.06); border: 1.5px solid rgba(45,106,79,0.2); border-radius: 12px; padding: 16px 20px; font-size: 14px; color: var(--ink-soft); line-height: 1.6; }
    .raffle-box strong { color: var(--accent-warm); display: block; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
    .raffle-options { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .raffle-options label { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
    .raffle-options input { width: auto; accent-color: var(--accent); }

    .checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .checkbox-item { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; transition: all 0.15s; font-size: 13px; color: var(--ink-soft); }
    .checkbox-item:hover { border-color: var(--accent-light); background: rgba(45,106,79,0.03); }
    .checkbox-item input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; }

    /* ── VERIFICATION: occupation multiselect dropdown (ive restyled this) ── */
    .occ-dd{position:relative;}
    .occ-dd-btn{width:100%;min-height:44px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:.5px solid var(--line2);border-radius:9px;font-family:var(--sans);font-size:13px;color:var(--ink);cursor:pointer;text-align:left;transition:border-color .15s;}
    .occ-dd-btn:hover{border-color:var(--green-m);}
    .occ-dd.open .occ-dd-btn{border-color:var(--green);}
    .occ-dd-btn .chev{width:14px;height:14px;stroke:var(--ink-muted);fill:none;stroke-width:2;flex-shrink:0;transition:transform .15s;}
    .occ-dd.open .chev{transform:rotate(180deg);}
    .occ-dd-count{font-size:11px;font-weight:700;color:var(--green);background:var(--green-l);border:.5px solid var(--green-m);padding:1px 8px;border-radius:100px;margin-left:8px;flex-shrink:0;}
    .occ-dd-panel{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:60;background:var(--bg);border:.5px solid var(--line2);border-radius:10px;box-shadow:0 12px 32px rgba(26,26,24,.14);max-height:300px;overflow-y:auto;padding:6px;}
    .occ-dd.open .occ-dd-panel{display:block;}
    .occ-dd-group{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-muted);padding:10px 10px 4px;}
    .occ-dd-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--ink-soft);cursor:pointer;transition:background .1s;}
    .occ-dd-item:hover{background:var(--paper-warm);}
    .occ-dd-item.on{color:var(--ink);font-weight:600;}
    .occ-dd-item input{accent-color:var(--green);width:14px;height:14px;flex-shrink:0;}

    .checkbox-item.checked { border-color: var(--accent); background: rgba(45,106,79,0.06); color: var(--ink); }

    .slot-builder { border: 1.5px solid var(--line); border-radius: 12px; padding: 16px; background: var(--paper); }
    .calendar-tools { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
    .calendar-nav { display:flex; align-items:center; gap:8px; }
    .calendar-nav button, .slot-add { height:34px; padding:0 12px; border:.5px solid var(--line2); border-radius:8px; background:var(--bg); color:var(--ink-soft); font-family:var(--sans); font-size:12px; font-weight:700; cursor:pointer; }
    .calendar-nav button:hover, .slot-add:hover { border-color:var(--green-m); background:var(--green-l); color:var(--green); }
    .calendar-range { font-size:13px; font-weight:700; color:var(--ink); }
    .calendar-hint { font-size:12px; color:var(--ink-muted); line-height:1.45; }
    .availability-grid { display:grid; grid-template-columns:70px repeat(7, minmax(92px, 1fr)); border:.5px solid var(--line); border-radius:10px; overflow:auto; user-select:none; background:var(--bg); }
    .cal-head, .time-head, .time-cell, .cal-cell { min-height:34px; border-right:.5px solid var(--line); border-bottom:.5px solid var(--line); display:flex; align-items:center; justify-content:center; }
    .cal-head { position:sticky; top:0; background:var(--paper-warm); z-index:2; padding:8px 6px; flex-direction:column; gap:2px; }
    .cal-head strong { font-size:12px; color:var(--ink); }
    .cal-head span { font-size:10px; color:var(--ink-muted); }
    .time-head { background:var(--paper-warm); color:var(--ink-muted); font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; }
    .time-cell { background:var(--paper-warm); color:var(--ink-muted); font-size:11px; font-weight:700; justify-content:flex-end; padding-right:9px; }
    .cal-cell { cursor:pointer; background:#fff; transition:background .08s, box-shadow .08s; }
    .cal-cell:hover { background:var(--green-l); }
    .cal-cell.selected { background:var(--green); box-shadow:inset 0 0 0 1px var(--green-d); }
    .cal-cell.selected:hover { background:var(--green-d); }
    .slot-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; min-height: 28px; }
    .slot-chip { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--green-m); background: var(--green-l); color: var(--green); border-radius: 999px; padding: 7px 10px 7px 12px; font-size: 12px; font-weight: 700; }
    .slot-chip button { border: none; background: transparent; color: var(--green); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 2px; }
    .slot-empty { color: var(--ink-muted); font-size: 12px; padding: 6px 0; }

    .filter-group-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); padding: 12px 0 8px; border-top: 1px solid var(--line); margin-top: 8px; }
    .filter-group-label:first-child { border-top: none; padding-top: 0; margin-top: 0; }

    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    .advanced-toggle { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink-soft); cursor: pointer; padding: 12px 0; user-select: none; }
    .advanced-toggle:hover { color: var(--ink); }
    .advanced-body { padding-top: 20px; display: flex; flex-direction: column; gap: 16px; }

    .submit-section { background: var(--bg); border: .5px solid var(--line); border-radius: 12px; padding: 20px 24px; display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
    .btn-cancel { padding: 10px 20px; background: transparent; color: var(--ink-muted); border: .5px solid var(--line2); border-radius: 8px; font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .btn-cancel:hover { background: var(--paper-warm); border-color: var(--ink-muted); color: var(--ink); }
    .btn-publish { padding: 10px 24px; background: var(--green); color: white; border: none; border-radius: 8px; font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer; transition: background .12s; display: flex; align-items: center; gap: 8px; }
    .btn-publish:hover { background: var(--green-d); }

    @media (max-width: 640px) {
      .sidebar { display: none; }
      .topbar { padding: 0 16px; }
      .topbar-title { display: none; }
      .container { padding: 28px 16px 60px; }
      .form-section { padding: 24px 20px; }
      .form-row, .form-row-3 { grid-template-columns: 1fr; }
      .availability-grid { grid-template-columns:62px repeat(7, 88px); }
      .checkbox-group { grid-template-columns: 1fr; }
      .wizard-label { font-size:10px; }
      .wizard-nav { flex-wrap:wrap; }
      .wizard-note { width:100%; flex-basis:100%; order:-1; }
      .btn-step { flex:1; }
      .submit-section { flex-direction: column-reverse; }
      .btn-cancel, .btn-publish { width: 100%; justify-content: center; }
    }
  </style>
