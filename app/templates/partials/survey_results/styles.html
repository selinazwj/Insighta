<style>
    :root {
      --ink: #1a1a18; --ink-soft: #4a4a44; --ink-muted: #8a8a82;
      --paper: #fafaf8; --paper-warm: #f5f3ee;
      --accent: #3b7c4f; --accent-dark: #2a5c39; --accent-light: #c2deca; --accent-warm: #c05621;
      --line: #eeece6; --line-strong: #e0ddd6;
      --serif: 'DM Serif Display', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
      --sidebar: 220px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; -webkit-font-smoothing: antialiased; }

    .sidebar{width:var(--sidebar);flex-shrink:0;background:#fff;border-right:.5px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
    .sidebar-logo{padding:20px 20px 18px;border-bottom:.5px solid var(--line);font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.2px;text-decoration:none;display:block;}
    .sidebar-logo span{color:var(--accent);}
    .sidebar-nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:1px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink-muted);text-decoration:none;border:none;background:none;font-family:var(--sans);width:100%;text-align:left;transition:background .12s,color .12s;}
    .nav-item:hover{background:var(--paper-warm);color:var(--ink-soft);}
    .nav-item.active{background:#e8f2eb;color:var(--accent);font-weight:600;}
    .nav-item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
    .nav-divider{height:.5px;background:var(--line);margin:6px 10px;}
    .sidebar-user{padding:14px 10px;border-top:.5px solid var(--line);}
    .user-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;text-decoration:none;transition:background .12s;}
    .user-row:hover{background:var(--paper-warm);}
    .user-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
    .user-name{font-size:13px;font-weight:500;color:var(--ink);}
    .user-email{font-size:11px;color:var(--ink-muted);margin-top:1px;}

    .main{flex:1;min-width:0;display:flex;flex-direction:column;}
    .topbar{height:56px;padding:0 32px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:14px;}
    .topbar-left{display:flex;align-items:center;gap:12px;min-width:0;}
    .back-btn{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-muted);text-decoration:none;font-weight:500;transition:color .12s;flex-shrink:0;padding:0;border:0;border-radius:0;}
    .back-btn:hover{color:var(--ink);background:transparent;}
    .back-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
    .topbar-sep{width:.5px;height:16px;background:var(--line);flex-shrink:0;}
    .topbar-title{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .topbar-action{font-size:13px;font-weight:700;color:#fff;text-decoration:none;border-radius:999px;padding:8px 15px;background:var(--accent);}
    .topbar-action:hover{background:var(--accent-dark);}

    /* Layout */
    .container { width: 100%; max-width: 1040px; margin: 0 auto; padding: 36px 32px 80px; }

    /* Header */
    .page-header { margin-bottom: 28px; }
    .page-kicker{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
    .page-header h1 { font-family: var(--sans); font-size: 32px; font-weight:300; color: var(--ink); letter-spacing: -0.6px; margin-bottom: 7px; }
    .page-header h1 strong { font-weight:800; }
    .page-header p { font-size: 14px; color: var(--ink-muted); font-weight: 400; line-height:1.6; }

    /* Stats row */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 32px; }
    .stat-card { background: white; border: 0.5px solid var(--line); border-radius: 10px; padding: 20px 24px; }
    .stat-value { font-size: 34px; font-weight: 300; color: var(--accent); letter-spacing: -0.8px; margin-bottom: 4px; }
    .stat-label { font-size: 13px; color: var(--ink-muted); font-weight: 300; }

    /* Question result cards */
    .q-result { background: white; border: 0.5px solid var(--line); border-radius: 10px; padding: 24px 28px; margin-bottom: 12px; }
    .q-result-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .q-result-num { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; color: var(--ink-muted); text-transform: uppercase; margin-bottom: 4px; }
    .q-result-text { font-size: 17px; font-weight: 500; color: var(--ink); line-height: 1.4; }
    .q-type-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 100px; background: var(--paper-warm); color: var(--ink-muted); border: 1px solid var(--line); white-space: nowrap; flex-shrink: 0; }
    .q-answer-count { font-size: 13px; color: var(--ink-muted); margin-bottom: 16px; }

    /* Bar chart for single/multiple/dropdown */
    .bar-list { display: flex; flex-direction: column; gap: 10px; }
    .bar-row { display: flex; align-items: center; gap: 12px; }
    .bar-label { font-size: 14px; color: var(--ink-soft); min-width: 140px; flex-shrink: 0; }
    .bar-track { flex: 1; height: 28px; background: var(--paper-warm); border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--accent); border-radius: 6px; transition: width 0.6s ease; display: flex; align-items: center; padding-left: 10px; min-width: 28px; }
    .bar-fill-text { font-size: 12px; font-weight: 600; color: white; white-space: nowrap; }
    .bar-count { font-size: 13px; color: var(--ink-muted); min-width: 40px; text-align: right; }

    /* Scale result */
    .scale-result { display: flex; flex-direction: column; gap: 12px; }
    .scale-avg { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .scale-avg-num { font-size: 46px; font-weight: 300; color: var(--accent); letter-spacing: -1px; }
    .scale-avg-label { font-size: 14px; color: var(--ink-muted); }
    .scale-bar-row { display: flex; align-items: center; gap: 10px; }
    .scale-dot-label { width: 20px; text-align: center; font-size: 13px; font-weight: 600; color: var(--ink-muted); }

    /* Text responses */
    .text-responses { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; }
    .text-response-item { padding: 12px 16px; background: var(--paper-warm); border-radius: 10px; font-size: 14px; color: var(--ink-soft); line-height: 1.6; border-left: 3px solid var(--line); }

    /* AI Analysis */
    .ai-analysis-section { background: white; border: 0.5px solid var(--line); border-radius: 10px; padding: 28px 32px; margin-top: 32px; }
    .ai-analysis-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .ai-icon { width: 38px; height: 38px; background: var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .ai-analysis-header h2 { font-family: var(--sans); font-size: 18px; font-weight: 800; color: var(--ink); }
    .ai-analysis-header p { font-size: 13px; color: var(--ink-muted); font-weight: 300; }
    .btn-analyze { padding: 11px 24px; background: var(--accent); color: white; border: none; border-radius: 10px; font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-analyze:hover { background: var(--accent-dark); }
    .btn-analyze:disabled { opacity: 0.6; cursor: not-allowed; }
    .analysis-result { margin-top: 20px; padding: 20px 24px; background: white; border-radius: 12px; border: 1px solid var(--line); font-size: 15px; color: var(--ink-soft); line-height: 1.8; display: none; }
    .analysis-result.visible { display: block; }
    .analysis-footer { margin-top: 12px; font-size: 12px; color: var(--ink-muted); }
    .quality-section { margin-top: 32px; background: #fff; border: 0.5px solid var(--line); border-radius: 10px; padding: 24px 28px; }
    .quality-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .quality-header h2 { font-family: var(--serif); font-size: 22px; color: var(--ink); }
    .quality-header p { font-size: 13px; color: var(--ink-muted); }
    .quality-tag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .quality-high { background: rgba(45,106,79,0.12); color: var(--accent); }
    .quality-medium { background: rgba(234,179,8,0.18); color: #854d0e; }
    .quality-low { background: rgba(239,68,68,0.16); color: #b91c1c; }
    .quality-fraud_risk { background: rgba(124,58,237,0.16); color: #6d28d9; }
    .quality-table { width: 100%; border-collapse: collapse; font-size: 13px; border: 1px solid var(--line); border-radius: 10px; overflow: visible; }
    .quality-table th, .quality-table td { border-bottom: 1px solid var(--line); padding: 10px 12px; text-align: left; vertical-align: top; }
    .quality-table th { background: var(--paper-warm); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-muted); }
    .quality-table tr:last-child td { border-bottom: none; }
    .quality-description { max-width: 280px; color: var(--ink-soft); line-height: 1.5; }
    .quality-reason-list { color: var(--ink-muted); line-height: 1.5; }
    .quality-empty { padding: 18px; border: 1px dashed var(--line); border-radius: 10px; color: var(--ink-muted); background: rgba(250,249,245,0.7); text-align: center; }
    .quality-import { margin: 16px 0 18px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
    .quality-import-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .quality-import input[type="file"] { flex: 1; min-width: 220px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: white; font-family: var(--sans); font-size: 13px; color: var(--ink-soft); }
    .quality-import button { padding: 9px 16px; border: none; border-radius: 9px; background: var(--accent); color: white; font-family: var(--sans); font-size: 13px; font-weight: 700; cursor: pointer; }
    .quality-import button:disabled { opacity: 0.6; cursor: not-allowed; }
    .quality-import-hint { margin-top: 9px; font-size: 12px; color: var(--ink-muted); line-height: 1.55; }
    .quality-import-status { display: none; margin-top: 10px; padding: 10px 12px; border-radius: 9px; font-size: 13px; }
    .quality-import-status.success { display: block; background: #ecfdf5; color: #166534; border: 1px solid #bbf7d0; }
    .quality-import-status.error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .quality-detail-panel { margin-top: 16px; border: 1px solid var(--line); border-radius: 12px; padding: 16px; background: #faf9f5; display: none; }
    .quality-detail-panel.open { display: block; }
    .quality-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .quality-detail-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12px; }
    .quality-detail-card strong { display: block; font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .quality-review-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    .quality-review-section-label { font-size: 11px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .quality-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .quality-actions button { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 12px; font-weight: 600; cursor: pointer; transition: background 0.15s, border-color 0.15s, box-shadow 0.15s, color 0.15s; }
    .quality-actions button:hover:not(.selected) { background: #f5f4f0; }
    .quality-actions button.danger { color: #b91c1c; border-color: #fecaca; }
    .quality-actions button.danger:hover:not(.selected) { background: #fef2f2; }
    #qualityReviewActions button.selected,
    #qualityReviewActions button.saved { background: #2d6a4f; color: #fff; border-color: #2d6a4f; box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.22); }
    #qualityReviewActions button.danger.selected,
    #qualityReviewActions button.danger.saved { background: #b91c1c; color: #fff; border-color: #b91c1c; box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.18); }
    .quality-detail-card.review-approved { border-color: #86efac; background: #ecfdf5; }
    .quality-detail-card.review-approved strong { color: #166534; }
    .quality-detail-card.review-rejected { border-color: #fecaca; background: #fef2f2; }
    .quality-detail-card.review-rejected strong { color: #b91c1c; }
    .quality-review-notes { margin-top: 14px; }
    .quality-review-notes label { display: block; font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    .quality-review-notes textarea { width: 100%; box-sizing: border-box; min-height: 72px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-family: var(--sans); font-size: 13px; resize: vertical; }
    .quality-review-notes textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(45,106,79,0.12); }
    .quality-review-hint { margin-top: 8px; font-size: 12px; color: var(--ink-muted); }
    .quality-review-submit { margin-top: 14px; padding: 10px 18px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
    .quality-review-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .quality-review-status { margin-top: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13px; display: none; }
    .quality-review-status.success { display: block; background: #ecfdf5; color: #166534; border: 1px solid #bbf7d0; }
    .quality-review-status.error { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .quality-review-done { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
    .quality-review-done-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .quality-review-done-actions .btn-done { padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
    .quality-review-done-actions .btn-next { padding: 10px 18px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
    .quality-subtable { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
    .quality-subtable th, .quality-subtable td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
    .review-dropdown { position: relative; display: inline-block; min-width: 118px; }
    .review-dropdown.is-loading { opacity: 0.65; pointer-events: none; }
    .review-dropdown-trigger {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 7px 11px; border-radius: 9px; border: 1px solid var(--line); background: #fff;
      font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--ink); cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .review-dropdown-trigger:hover { background: #faf9f5; border-color: #d8d6ce; }
    .review-dropdown.open .review-dropdown-trigger { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(45,106,79,0.12); }
    .review-dropdown-chevron { font-size: 10px; color: var(--ink-muted); transition: transform 0.15s; }
    .review-dropdown.open .review-dropdown-chevron { transform: rotate(180deg); }
    .review-dropdown-menu {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 100;
      background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
    }
    .review-dropdown.open .review-dropdown-menu { display: block; }
    .review-dropdown-option {
      width: 100%; text-align: left; padding: 8px 10px; border: none; border-radius: 7px;
      background: transparent; font-family: var(--sans); font-size: 12px; font-weight: 600;
      color: var(--ink); cursor: pointer;
    }
    .review-dropdown-option:hover { background: #f3f1ea; }
    .review-dropdown-option.is-active { background: rgba(45,106,79,0.1); color: var(--accent); }
    .review-dropdown.status-approved .review-dropdown-trigger { border-color: #86efac; color: #166534; }
    .review-dropdown.status-rejected .review-dropdown-trigger { border-color: #fecaca; color: #b91c1c; }
    .review-dropdown.status-pending .review-dropdown-trigger { border-color: #fde68a; color: #854d0e; }
    .quality-section {
      margin-top: 34px;
      background: #fff;
      border: .5px solid var(--line);
      border-radius: 12px;
      padding: 0;
      overflow: hidden;
    }
    .quality-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      margin: 0;
      padding: 24px 28px 20px;
      border-bottom: .5px solid var(--line);
      background: linear-gradient(180deg, #fff 0%, rgba(250,248,244,.72) 100%);
    }
    .quality-kicker {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 7px;
    }
    .quality-header h2 {
      font-family: var(--sans);
      font-size: 22px;
      font-weight: 300;
      letter-spacing: -.3px;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .quality-header h2 strong { font-weight: 800; }
    .quality-header p {
      max-width: 560px;
      font-size: 13px;
      color: var(--ink-muted);
      line-height: 1.6;
    }
    .quality-refresh-btn {
      border: .5px solid var(--line-strong);
      border-radius: 999px;
      background: #fff;
      color: var(--ink-soft);
      padding: 8px 15px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .quality-refresh-btn:hover { border-color: var(--accent-light); color: var(--accent); background: #f8fbf9; }
    .quality-import {
      margin: 0;
      padding: 18px 28px;
      border: 0;
      border-bottom: .5px solid var(--line);
      border-radius: 0;
      background: var(--paper);
    }
    .quality-import-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }
    .quality-import input[type="file"] {
      min-width: 0;
      padding: 10px 12px;
      border: .5px solid var(--line-strong);
      border-radius: 9px;
      background: #fff;
      font-family: var(--sans);
      font-size: 13px;
      color: var(--ink-soft);
    }
    .quality-import button {
      padding: 10px 16px;
      border: none;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .quality-import button:hover { background: var(--accent-dark); }
    .quality-import-hint {
      margin-top: 9px;
      font-size: 12px;
      color: var(--ink-muted);
      line-height: 1.55;
    }
    .quality-body { padding: 20px 28px 28px; }
    .quality-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    .quality-summary-card {
      border: .5px solid var(--line);
      border-radius: 10px;
      background: var(--paper);
      padding: 13px 14px;
    }
    .quality-summary-n {
      font-size: 24px;
      font-weight: 300;
      color: var(--accent);
      letter-spacing: -.4px;
      margin-bottom: 3px;
    }
    .quality-summary-l {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--ink-muted);
    }
    .quality-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .quality-row-card {
      border: .5px solid var(--line);
      border-radius: 11px;
      background: #fff;
      padding: 16px 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 132px 128px;
      gap: 16px;
      align-items: center;
      transition: border-color .15s, box-shadow .15s;
    }
    .quality-row-card:hover {
      border-color: var(--accent-light);
      box-shadow: 0 8px 26px rgba(59,124,79,.06);
    }
    .quality-row-main { min-width: 0; }
    .quality-row-top {
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .quality-row-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: min(320px, 100%);
    }
    .quality-row-desc {
      font-size: 13px;
      color: var(--ink-soft);
      line-height: 1.55;
      margin-bottom: 6px;
    }
    .quality-row-reasons {
      font-size: 12px;
      color: var(--ink-muted);
      line-height: 1.5;
    }
    .quality-score-box {
      border: .5px solid var(--line);
      border-radius: 10px;
