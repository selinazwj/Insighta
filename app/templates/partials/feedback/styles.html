<style>
    :root {
      --green:#3b7c4f; --green-d:#2a5c39; --green-l:#e8f2eb; --green-m:#c2deca;
      --ink:#1a1a18; --ink2:#4a4a44; --ink3:#8a8a82; --ink4:#b8b8b0;
      --bg:#ffffff; --bg2:#fafaf8; --bg3:#f5f3ee;
      --line:#eeece6; --line2:#e0ddd6;
      --serif:'DM Serif Display', Georgia, serif;
      --sans:'DM Sans', system-ui, sans-serif;
      --sidebar:220px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:var(--sans);background:var(--bg2);color:var(--ink);min-height:100vh;display:flex;-webkit-font-smoothing:antialiased;}

    .sidebar{width:var(--sidebar);flex-shrink:0;background:var(--bg);border-right:.5px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
    .sidebar-logo{padding:20px 20px 18px;border-bottom:.5px solid var(--line);font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-0.2px;text-decoration:none;display:block;}
    .sidebar-logo span{color:var(--green);}
    .sidebar-nav{flex:1;padding:10px;display:flex;flex-direction:column;gap:1px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;font-size:13px;font-weight:500;color:var(--ink3);text-decoration:none;border:none;background:none;font-family:var(--sans);width:100%;text-align:left;transition:background .12s,color .12s;}
    .nav-item:hover{background:var(--bg3);color:var(--ink2);}
    .nav-item.active{background:var(--green-l);color:var(--green);font-weight:600;}
    .nav-item svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
    .nav-divider{height:.5px;background:var(--line);margin:6px 10px;}
    .sidebar-user{padding:14px 10px;border-top:.5px solid var(--line);}
    .user-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;text-decoration:none;transition:background .12s;}
    .user-row:hover{background:var(--bg3);}
    .user-avatar{width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
    .user-name{font-size:13px;font-weight:500;color:var(--ink);}
    .user-email{font-size:11px;color:var(--ink3);margin-top:1px;}

    .main{flex:1;min-width:0;display:flex;flex-direction:column;}
    .topbar{height:56px;padding:0 32px;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);border-bottom:.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:80;gap:14px;}
    .topbar-left{display:flex;align-items:center;gap:12px;min-width:0;}
    .back-btn{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink3);text-decoration:none;font-weight:500;transition:color .12s;flex-shrink:0;}
    .back-btn:hover{color:var(--ink);}
    .back-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
    .topbar-sep{width:.5px;height:16px;background:var(--line);flex-shrink:0;}
    .topbar-title{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

    .content{width:100%;max-width:1040px;margin:0 auto;padding:36px 32px 80px;}
    .page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px;}
    .page-kicker{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:8px;}
    .page-header h1{font-size:32px;font-weight:300;color:var(--ink);letter-spacing:-.6px;margin-bottom:7px;}
    .page-header h1 strong{font-weight:700;}
    .page-header p{font-size:14px;color:var(--ink3);line-height:1.6;max-width:560px;}
    .credit-card{background:var(--green-l);border:.5px solid var(--green-m);border-radius:12px;padding:16px 18px;max-width:300px;color:var(--ink2);font-size:13px;line-height:1.6;}
    .credit-card strong{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:4px;}

    .feedback-shell{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start;}
    .form-card,.side-card,.success-banner{background:var(--bg);border:.5px solid var(--line);border-radius:12px;}
    .form-card{padding:26px 28px;}
    .side-card{padding:20px 22px;position:sticky;top:80px;}
    .side-card h2{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:10px;}
    .side-card p{font-size:13px;color:var(--ink3);line-height:1.65;margin-bottom:14px;}
    .side-list{display:flex;flex-direction:column;gap:8px;}
    .side-item{padding:10px 12px;border:.5px solid var(--line);border-radius:8px;background:var(--bg2);font-size:12px;color:var(--ink2);line-height:1.45;}

    .success-banner{padding:16px 18px;margin-bottom:18px;border-color:var(--green-m);background:var(--green-l);}
    .success-banner h3{font-size:14px;font-weight:700;color:var(--green);margin-bottom:4px;}
    .success-banner p{font-size:13px;color:var(--ink2);line-height:1.6;}

    .section-title{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px;}
    .section-sub{font-size:12px;color:var(--ink3);margin-bottom:18px;}
    .category-label,.form-group label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:7px;}
    .category-pills{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
    .category-pill{padding:10px 13px;border:.5px solid var(--line2);border-radius:8px;background:var(--bg);font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer;transition:all .12s;text-align:left;user-select:none;}
    .category-pill:hover{border-color:var(--green-m);color:var(--ink2);background:var(--green-l);}
    .category-pill.selected{border-color:var(--green);background:var(--green-l);color:var(--green);}
    .form-group{margin-bottom:18px;}
    .form-group input,.form-group textarea{width:100%;border:.5px solid var(--line2);border-radius:8px;padding:10px 14px;font-family:var(--sans);font-size:14px;color:var(--ink);background:var(--bg2);transition:border-color .15s,background .15s;}
    .form-group input:focus,.form-group textarea:focus{outline:none;border-color:var(--green);background:var(--bg);}
    .form-group input::placeholder,.form-group textarea::placeholder{color:var(--ink4);}
    .form-group textarea{resize:vertical;min-height:150px;line-height:1.6;}
    .btn-submit{width:100%;padding:10px 24px;background:var(--green);color:#fff;border:none;border-radius:8px;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;transition:background .12s;}
    .btn-submit:hover{background:var(--green-d);}

    @media(max-width:760px){
      .sidebar{display:none;}
      .topbar{padding:0 16px;}
      .topbar-title{display:none;}
      .content{padding:28px 16px 64px;}
      .page-header{display:block;}
      .credit-card{max-width:none;margin-top:18px;}
      .feedback-shell{grid-template-columns:1fr;}
      .side-card{position:static;}
      .category-pills{grid-template-columns:1fr;}
      .form-card{padding:22px 18px;}
    }
  </style>
