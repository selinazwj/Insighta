<style>
    :root {
      --ink: #1a1a18;
      --ink-soft: #4a4a44;
      --ink-muted: #8a8a82;
      --paper: #faf9f5;
      --paper-warm: #f3f1ea;
      --accent: #2d6a4f;
      --accent-light: #52b788;
      --line: #e0ddd3;
      --serif: 'DM Serif Display', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      background: var(--paper);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border: 0.5px solid var(--line);
      border-radius: 12px;
      padding: 56px 48px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      position: relative;
      z-index: 1;
      box-shadow: 0 10px 32px rgba(26,26,24,0.05);
    }

    .shield-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(45,106,79,0.1);
      border: 2px solid rgba(45,106,79,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 36px;
      animation: pop 0.4s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-family: var(--serif);
      font-size: 32px;
      color: var(--ink);
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 16px;
      color: var(--ink-muted);
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .info-box {
      background: var(--paper-warm);
      border: 0.5px solid var(--line);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 32px;
      text-align: left;
    }

    .info-box .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 6px;
    }

    .info-box .message {
      font-size: 14px;
      color: var(--ink);
      line-height: 1.6;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 28px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-bottom: 12px;
    }

    .btn-primary:hover {
      background: #245c43;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(45,106,79,0.25);
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      background: transparent;
      color: var(--ink-muted);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      font-family: var(--sans);
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s;
      width: 100%;
    }

    .btn-secondary:hover {
      background: var(--paper-warm);
      border-color: var(--ink-muted);
      color: var(--ink);
    }

    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-box {
      background: #fff5f5;
      color: #c53030;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-size: 14px;
      border: 1px solid #fed7d7;
      text-align: left;
    }

    /* ive added this for phase 4 (participant nudge) — neutral notice, not an error */
    .notice-box {
      background: #fef9e7;
      color: #92400e;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-size: 14px;
      border: 1px solid #f5d47a;
      text-align: left;
    }

    /* OTP flow */
    .code-row { display: flex; gap: 10px; align-items: stretch; margin-bottom: 12px; }
    .code-row input {
      flex: 1; height: 48px; padding: 0 14px;
      border: 1px solid var(--line); border-radius: 10px;
      font-family: var(--sans); font-size: 20px; font-weight: 600;
      letter-spacing: 6px; text-align: center; color: var(--ink);
      background: var(--paper-warm);
    }
    .code-row input:focus { outline: none; border-color: var(--accent); background: white; }
    .btn-send-code {
      height: 48px; padding: 0 18px; flex-shrink: 0;
      background: white; color: var(--accent);
      border: 1.5px solid var(--line); border-radius: 10px;
      font-family: var(--sans); font-size: 14px; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: all .2s;
    }
    .btn-send-code:hover { background: var(--paper-warm); border-color: var(--accent); }
    .btn-send-code:disabled { opacity: 0.5; cursor: not-allowed; }
    .code-hint { font-size: 13px; color: var(--ink-muted); margin: -2px 0 22px; text-align: left; }
    .code-hint.success { color: var(--accent); }
    .code-hint.error { color: #c53030; }

    /* ive added these for verification — LinkedIn option (phase 2b) */
    .or-divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--ink-muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    .or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    .btn-linkedin {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 13px 28px; margin-bottom: 12px;
      background: #0a66c2; color: white; border: none; border-radius: 10px;
      font-family: var(--sans); font-size: 15px; font-weight: 600;
      text-decoration: none; cursor: pointer; transition: all 0.2s;
    }
    .btn-linkedin:hover { background: #084d94; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(10,102,194,0.25); }
    .btn-linkedin svg { width: 18px; height: 18px; fill: currentColor; }

    .upgrade-title { font-size: 13px; font-weight: 700; color: var(--ink-soft); text-align: left; margin-bottom: 10px; }

    @media (max-width: 480px) {
      .card { padding: 40px 24px; }
    }
  </style>
