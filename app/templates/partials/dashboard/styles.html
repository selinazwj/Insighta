<style>
    /* ── GAME TOKENS ── */
    :root {
      --lime:   #d9ed92; --lime2:  #b5e48c; --lime3:  #99d98c;
      --em:     #76c893; --teal:   #34a0a4; --teal2:  #168aad;
      --ocean:  #1a759f; --baltic: #1e6091; --yale:   #184e77;
      --ink:    #12324a; --ink2:   #2f5f6d; --ink3:   #5f8390;
      --paper:  #fcfff5; --paper2: #f4fbdf; --paper3: #eefbf7;
      --line:   #d9efc8; --line2:  #b8e9ad;
      --sans:   'DM Sans', system-ui, sans-serif;
      --sidebar-w: 220px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-font-smoothing:antialiased; }
    body { font-family:var(--sans); background:var(--paper); color:var(--ink); min-height:100vh; display:flex; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w); flex-shrink:0;
      background: #fff;
      border-right: 2px solid var(--line);
      display: flex; flex-direction:column;
      position: sticky; top:0; height:100vh;
      overflow: hidden;
    }
    .sidebar-top {
      padding: 20px 20px 16px;
      border-bottom: 2px solid var(--line);
      display: flex; align-items:center; justify-content:space-between;
    }
    .sidebar-logo { font-size:18px; font-weight:900; color:var(--ink); letter-spacing:-0.3px; }
    .sidebar-logo span { color:var(--teal); }
    .earnings-pill {
      background:var(--lime); color:var(--yale);
      font-size:12px; font-weight:900;
      padding:5px 11px; border-radius:20px;
      border:2px solid var(--lime2);
      box-shadow:0 3px 0 var(--lime3);
      white-space:nowrap;
    }
    .sidebar-nav { flex:1; padding:12px 10px; display:flex; flex-direction:column; gap:2px; }
    .nav-item {
      display:flex; align-items:center; gap:10px;
      padding:10px 12px; border-radius:12px;
      font-size:14px; font-weight:700; color:var(--ink3);
      cursor:pointer; text-decoration:none;
      transition:all .15s; border:2px solid transparent;
    }
    .nav-item:hover { background:var(--paper2); color:var(--ink2); }
    .nav-item.active {
      background:var(--paper2); color:var(--yale);
      border-color:var(--line); box-shadow:0 3px 0 var(--line2);
    }
    .nav-item svg { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .nav-badge { margin-left:auto; background:var(--teal); color:#fff; font-size:10px; font-weight:900; padding:2px 7px; border-radius:10px; }
    .sidebar-bottom {
      padding:14px 10px;
      border-top:2px solid var(--line);
    }
    .user-row {
      display:flex; align-items:center; gap:10px;
      padding:10px 12px; border-radius:12px; cursor:pointer;
      text-decoration:none; transition:background .15s;
    }
    .user-row:hover { background:var(--paper2); }
    .avatar {
      width:34px; height:34px; border-radius:10px;
      background:var(--lime); color:var(--yale);
      display:flex; align-items:center; justify-content:center;
      font-size:14px; font-weight:900;
      border:2px solid var(--lime2); box-shadow:0 2px 0 var(--lime3);
      flex-shrink:0;
    }
    .user-name { font-size:13px; font-weight:700; color:var(--ink); }
    .user-sub  { font-size:11px; color:var(--ink3); margin-top:1px; }

    /* ── MAIN CONTENT ── */
    .main { flex:1; min-width:0; display:flex; flex-direction:column; }

    /* topbar */
    .topbar {
      background:rgba(246,251,236,0.9); backdrop-filter:blur(16px);
      border-bottom:2px solid var(--line);
      padding:0 32px; height:58px;
      display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; z-index:50;
    }
    .topbar-title { font-size:17px; font-weight:900; color:var(--ink); }
    .topbar-right { display:flex; align-items:center; gap:10px; }
    .topbar-date { font-size:12px; color:var(--ink3); font-weight:700; }

    /* ── CONTENT AREA ── */
    .content { flex:1; padding:28px 32px; max-width:900px; }

    /* impact banner */
    .impact-banner {
      background:var(--paper2); border:2px solid var(--line2);
      border-radius:16px; padding:16px 20px;
      display:flex; align-items:center; gap:16px;
      margin-bottom:24px;
      box-shadow:0 4px 0 var(--em);
    }
    .impact-icon {
      width:44px; height:44px; border-radius:14px;
      background:var(--teal); display:flex; align-items:center; justify-content:center;
      flex-shrink:0; box-shadow:0 3px 0 var(--yale);
    }
    .impact-icon svg { width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2; }
    .impact-text strong { font-size:15px; font-weight:900; color:var(--yale); display:block; margin-bottom:3px; }
    .impact-text p { font-size:13px; color:var(--ink2); font-weight:500; }
    .impact-streak {
      margin-left:auto; text-align:center;
      background:#fff; border:2px solid var(--line2);
      border-radius:12px; padding:8px 16px;
      box-shadow:0 3px 0 var(--em); flex-shrink:0;
    }
    .streak-num { font-size:22px; font-weight:900; color:var(--teal2); }
    .streak-lbl { font-size:10px; font-weight:900; color:var(--ink3); text-transform:uppercase; letter-spacing:.05em; }

    /* section header */
    .section-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .section-title { font-size:13px; font-weight:900; color:var(--ink2); text-transform:uppercase; letter-spacing:.06em; }
    .section-count { font-size:12px; font-weight:700; color:var(--ink3); background:var(--paper2); border:1.5px solid var(--line); padding:3px 9px; border-radius:20px; }

    /* ── STUDY CARDS ── */
    .studies { display:flex; flex-direction:column; gap:12px; }

    .study-card {
      background:#fff;
      border:2px solid var(--line2);
      border-radius:18px;
      padding:20px 22px;
      box-shadow:0 5px 0 var(--em);
      transition:transform .12s, box-shadow .12s;
      cursor:pointer;
    }
    .study-card:hover { transform:translateY(-2px); box-shadow:0 7px 0 var(--em); }
    .study-card.completed {
      border-color:var(--line); background:var(--paper);
      box-shadow:0 3px 0 var(--line2); opacity:.75;
    }

    .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .card-left { flex:1; min-width:0; }
    .card-cat {
      font-size:11px; font-weight:900; color:var(--yale);
      background:var(--lime); border:1.5px solid var(--lime2);
      padding:3px 10px; border-radius:20px;
      display:inline-block; margin-bottom:8px;
    }
    .card-title { font-size:16px; font-weight:900; color:var(--ink); line-height:1.3; margin-bottom:4px; }
    .card-desc { font-size:13px; color:var(--ink3); line-height:1.5; font-weight:500; }
    .niche-callout { margin-top:9px; padding:8px 10px; border-radius:8px; border:1.5px solid #f3a6a6; background:#fff1f1; color:#8f3030; font-size:12px; font-weight:700; line-height:1.45; }
    .niche-callout strong { font-weight:900; margin-right:4px; }
    .benefit-callout { margin-top:8px; padding:8px 10px; border-radius:8px; border:1.5px solid #99d98c; background:#f2fbec; color:#245f46; font-size:12px; font-weight:700; line-height:1.45; }
    .benefit-callout strong { font-weight:900; margin-right:4px; }
    .card-reward {
      text-align:right; flex-shrink:0;
    }
    .reward-amt { font-size:26px; font-weight:900; color:var(--teal2); letter-spacing:-0.5px; white-space:nowrap; }
    .reward-lbl { font-size:11px; color:var(--ink3); font-weight:700; margin-top:1px; }

    .card-meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .meta-pill {
      font-size:12px; font-weight:800; color:var(--ink2);
      background:var(--paper2); border:1.5px solid var(--line);
      padding:5px 10px; border-radius:20px;
      display:flex; align-items:center; gap:5px;
    }
    .meta-pill svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:2; flex-shrink:0; }

    .card-footer { display:flex; align-items:center; gap:12px; padding-top:14px; border-top:2px dashed var(--line); }
    .match-wrap { flex:1; }
    .match-label-row { display:flex; justify-content:space-between; margin-bottom:5px; }
    .match-lbl { font-size:11px; font-weight:900; color:var(--ink3); }
    .match-pct { font-size:11px; font-weight:900; color:var(--teal2); }
    .match-track { height:6px; background:var(--paper2); border-radius:3px; overflow:hidden; border:1.5px solid var(--line); }
    .match-fill  { height:100%; background:var(--teal); border-radius:3px; transition:width .4s ease; }

    .card-actions { display:flex; gap:8px; flex-shrink:0; }
    .btn-skip {
      padding:10px 18px; border-radius:12px; font-family:var(--sans);
      font-size:13px; font-weight:900; cursor:pointer;
      background:#fff; color:var(--ink3);
      border:2px solid var(--line); box-shadow:0 3px 0 var(--line2);
      transition:transform .1s, box-shadow .1s;
    }
    .btn-skip:hover { transform:translateY(1px); box-shadow:0 2px 0 var(--line2); }
    .btn-take {
      padding:10px 22px; border-radius:12px; font-family:var(--sans);
      font-size:13px; font-weight:900; cursor:pointer;
      background:var(--teal); color:#fff;
      border:2px solid var(--yale); box-shadow:0 4px 0 var(--yale);
      transition:transform .1s, box-shadow .1s;
      display:flex; align-items:center; gap:6px;
    }
    .btn-take:hover { transform:translateY(2px); box-shadow:0 2px 0 var(--yale); }
    .btn-take svg { width:14px; height:14px; stroke:#fff; fill:none; stroke-width:2.5; }

    .btn-done {
      padding:10px 18px; border-radius:12px; font-family:var(--sans);
      font-size:13px; font-weight:900; cursor:pointer;
      background:var(--paper2); color:var(--ink3);
      border:2px solid var(--line); box-shadow:0 3px 0 var(--line2);
      display:flex; align-items:center; gap:5px;
    }

    .slot-modal-bg {
      display:none; position:fixed; inset:0; z-index:200;
      background:rgba(18,50,74,.34); backdrop-filter:blur(6px);
      align-items:center; justify-content:center; padding:20px;
    }
    .slot-modal-bg.open { display:flex; }
    .slot-modal {
      width:100%; max-width:680px; background:#fff;
      border:2px solid var(--line2); border-radius:18px;
      box-shadow:0 6px 0 var(--em); padding:22px;
    }
    .slot-modal h3 { font-size:20px; font-weight:900; color:var(--ink); margin-bottom:6px; }
    .slot-modal p { font-size:13px; color:var(--ink3); font-weight:600; line-height:1.5; margin-bottom:14px; }
    .slot-options { display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
    .slot-option { display:flex; align-items:center; gap:10px; padding:11px 12px; border:2px solid var(--line); border-radius:12px; cursor:pointer; font-size:13px; font-weight:900; color:var(--ink2); }
    .slot-option:hover { background:var(--paper2); border-color:var(--line2); }
    .slot-option input { accent-color:var(--teal); }
    .slot-calendar { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; max-height:420px; overflow:auto; padding-right:4px; }
    .slot-day { border:2px solid var(--line); border-radius:14px; overflow:hidden; background:var(--paper2); }
    .slot-day-title { padding:10px 12px; background:#fff; border-bottom:2px solid var(--line); font-size:12px; font-weight:950; color:var(--ink); }
    .slot-day-body { display:grid; gap:7px; padding:10px; }
    .slot-check {
      display:flex; align-items:center; gap:8px; min-height:38px;
      border:2px solid transparent; background:#fff; border-radius:11px;
      padding:8px 9px; cursor:pointer; font-size:12px; font-weight:900; color:var(--ink2);
    }
    .slot-check:hover { border-color:var(--line2); }
    .slot-check input { accent-color:var(--teal); }
    .slot-check:has(input:checked) { background:var(--mint); border-color:var(--teal); color:var(--ink); }
    .slot-requirement { margin:0 0 12px; padding:10px 12px; border-radius:12px; background:var(--mint); color:var(--ink); font-size:13px; font-weight:900; }
    .slot-modal-actions { display:flex; justify-content:flex-end; gap:8px; }
    .slot-cancel, .slot-confirm {
      border-radius:12px; font-family:var(--sans); font-size:13px; font-weight:900;
      padding:10px 16px; cursor:pointer;
    }
    .slot-cancel { background:#fff; color:var(--ink3); border:2px solid var(--line); box-shadow:0 3px 0 var(--line2); }
    .slot-confirm { background:var(--teal); color:#fff; border:2px solid var(--yale); box-shadow:0 4px 0 var(--yale); }
    .slot-confirm:hover { transform:translateY(2px); box-shadow:0 2px 0 var(--yale); }

    /* empty state */
    .empty { text-align:center; padding:64px 24px; }
    .empty svg { width:48px; height:48px; stroke:var(--line2); fill:none; stroke-width:1.5; margin-bottom:16px; }
    .empty h3 { font-size:20px; font-weight:900; color:var(--ink); margin-bottom:6px; }
    .empty p  { font-size:14px; color:var(--ink3); font-weight:500; line-height:1.6; }
    .my-studies-hint {
      margin-top: 22px; padding: 14px 16px; text-align: center;
      color: var(--ink3); font-size: 13px; font-weight: 700; line-height: 1.5;
      border-top: 1px solid var(--line); opacity: .9;
    }
    .my-studies-link {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--teal); font-weight: 900; text-decoration: underline;
      text-underline-offset: 3px; cursor: pointer;
    }
    .my-studies-link::after { content: "→"; font-size: 12px; text-decoration: none; }
    .my-studies-link:hover { color: var(--yale); }

    /* tap burst */
    .burst {
      position:fixed; z-index:9999; width:7px; height:7px;
      border-radius:50%; pointer-events:none;
      animation:burst .42s ease-out forwards;
    }
    @keyframes burst {
      from { opacity:1; transform:translate(0,0) scale(1); }
      to   { opacity:0; transform:translate(var(--tx),var(--ty)) scale(.1); }
    }

    /* scrollbar */
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--line2); border-radius:2px; }
  </style>
