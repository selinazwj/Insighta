<style>
    :root {
      --green: #3b7c4f; --green-d: #2a5c39; --green-l: #e8f2eb; --green-m: #c2deca;
      --ink: #1a1a18; --ink-soft: #4a4a44; --ink-muted: #707068; --ink4: #b8b8b0;
      --paper: #ffffff; --paper-warm: #fafaf8; --paper-soft: #f5f3ee;
      --accent: var(--green); --accent-light: var(--green-m); --accent-warm: var(--green);
      --line: #eeece6; --line2: #e0ddd6;
      --serif: 'DM Serif Display', Georgia, serif;
      --sans: 'DM Sans', system-ui, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--sans); background: var(--paper); min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; color: var(--ink); -webkit-font-smoothing: antialiased; }

    .left-panel { background: var(--paper-warm); border-right: 0.5px solid var(--line); padding: 60px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
    .left-panel::before, .left-panel::after { display: none; }
    .panel-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; position: relative; z-index: 1; }
    .panel-logo img { height: 30px; }
    .panel-logo span { font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: -0.2px; }
    .panel-body { position: relative; z-index: 1; }
    .panel-body h2 { font-family: var(--sans); font-size: clamp(36px, 4vw, 56px); font-weight: 300; color: var(--ink); line-height: 1.08; letter-spacing: -2px; margin-bottom: 20px; max-width: 560px; }
    .panel-body h2 em { font-style: normal; font-weight: 700; color: var(--ink); }
    .panel-body p { font-size: 16px; color: var(--ink-muted); line-height: 1.7; font-weight: 400; max-width: 440px; }
    .panel-footer { position: relative; z-index: 1; }
    .panel-quote { background: var(--paper); border: 0.5px solid var(--line); border-radius: 10px; padding: 24px; max-width: 440px; }
    .panel-quote p { font-family: var(--serif); font-size: 17px; font-style: italic; color: var(--ink); line-height: 1.6; margin-bottom: 10px; }
    .panel-quote span { font-size: 12px; color: var(--ink-muted); }

    .right-panel { display: flex; align-items: center; justify-content: center; padding: 60px 40px; }
    .form-wrapper { width: 100%; max-width: 380px; }
    .mobile-brand { display: none; text-decoration: none; color: var(--ink); font-size: 17px; font-weight: 700; margin-bottom: 28px; }
    .mobile-brand span { color: var(--green); }

    .form-header { margin-bottom: 34px; }
    .form-header h1 { font-family: var(--sans); font-size: 32px; font-weight: 300; color: var(--ink); letter-spacing: -0.8px; margin-bottom: 8px; }
    .form-header p { font-size: 14px; color: var(--ink-muted); font-weight: 400; line-height: 1.7; }

    .error-box { background: #fff5f5; color: #c53030; padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-size: 14px; border: 1px solid #fed7d7; }
    .success-box { background: rgba(45,106,79,0.06); color: var(--accent); padding: 12px 16px; border-radius: 8px; margin-bottom: 24px; font-size: 14px; border: 1px solid rgba(45,106,79,0.2); }
    .role-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--green-l); border: 0.5px solid var(--green-m); border-radius: 20px; color: var(--green); font-size: 11px; font-weight: 600; margin-bottom: 16px; }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-soft); margin-bottom: 6px; }
    .form-group input { width: 100%; height: 42px; padding: 0 12px; border: 0.5px solid var(--line2); border-radius: 8px; font-family: var(--sans); font-size: 13px; color: var(--ink); background: var(--paper-warm); transition: border-color .15s, background .15s; }
    .form-group input:focus { outline: none; border-color: var(--green); background: var(--paper); box-shadow: none; }
    .form-group input::placeholder { color: var(--ink4); font-weight: 400; }

    .code-row { display: flex; gap: 10px; align-items: flex-end; }
    .code-row input { flex: 1; letter-spacing: 4px; font-size: 18px; font-weight: 600; text-align: center; }
    .btn-send-code { padding: 12px 16px; background: white; color: var(--accent); border: 1.5px solid rgba(45,106,79,0.4); border-radius: 10px; font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; flex-shrink: 0; }
    .btn-send-code:hover { background: rgba(45,106,79,0.06); }
    .btn-send-code:disabled { opacity: 0.5; cursor: not-allowed; }
    .code-hint { font-size: 12px; color: var(--ink-muted); margin-top: 6px; }
    .code-hint.success { color: var(--accent); }
    .code-hint.error { color: #c53030; }

    .btn-submit { width: 100%; height: 42px; background: var(--green); color: white; border: none; border-radius: 20px; font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; margin-top: 4px; }
    .btn-submit:hover { background: var(--green-d); transform: none; box-shadow: none; }

    .forgot-link { display: block; text-align: right; font-size: 13px; color: var(--ink-muted); margin-top: -12px; margin-bottom: 20px; cursor: pointer; }
    .forgot-link:hover { color: var(--accent); }

    .form-footer { text-align: center; margin-top: 24px; font-size: 14px; color: var(--ink-muted); }
    .form-footer a { color: var(--green); font-weight: 600; text-decoration: none; }
    .form-footer a:hover { text-decoration: underline; }

    /* Social login */
    .social-btns { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
    .btn-social { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 42px; padding: 0 16px; border: 0.5px solid var(--line2); border-radius: 8px; background: var(--paper); font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--ink); cursor: pointer; text-decoration: none; transition: border-color .15s, background .15s; }
    .btn-social:hover { border-color: var(--green-m); background: var(--green-l); transform: none; box-shadow: none; }
    .btn-social svg { flex-shrink: 0; }
    .divider { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    .divider span { font-size: 12px; color: var(--ink-muted); white-space: nowrap; font-weight: 500; }

    /* Reset panel */
    .reset-panel { display: none; margin-top: 32px; padding-top: 32px; border-top: 1px solid var(--line); }
    .reset-panel.open { display: block; }
    .reset-panel h3 { font-family: var(--sans); font-size: 22px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
    .reset-panel p { font-size: 14px; color: var(--ink-muted); margin-bottom: 24px; font-weight: 300; }

    @media (max-width: 768px) {
      body { grid-template-columns: 1fr; }
      .left-panel { display: none; }
      .right-panel { padding: 48px 24px; }
      .mobile-brand { display: block; }
      .form-group input { font-size: 16px; }
      .code-row input { min-width: 0; }
    }


    {% if participant_app %}
    :root {
      --lime: #d9ed92; --lime2: #b5e48c; --lime3: #99d98c;
      --em: #76c893; --teal: #34a0a4; --teal2: #168aad;
      --ocean: #1a759f; --baltic: #1e6091; --yale: #184e77;
      --green: var(--teal); --green-d: var(--teal2); --green-l: #eefbf7; --green-m: var(--lime2);
      --ink: #12324a; --ink-soft: #2f5f6d; --ink-muted: #5f8390; --ink4: #94aeb4;
      --paper: #fcfff5; --paper-warm: #f4fbdf; --paper-soft: #eefbf7;
      --accent: var(--teal); --accent-light: var(--lime2); --accent-warm: var(--teal);
      --line: #d9efc8; --line2: #b8e9ad;
    }
    body {
      background:
        radial-gradient(circle at 12% 14%, rgba(217,237,146,.65), rgba(217,237,146,0) 24%),
        linear-gradient(120deg, var(--paper), var(--paper-warm));
    }
    .left-panel {
      background: rgba(255,255,255,.72);
      border-right: 2px solid var(--line);
    }
    .panel-logo span { font-size: 18px; font-weight: 900; letter-spacing: 0; }
    .panel-body h2 {
      font-size: clamp(38px, 4vw, 58px);
      font-weight: 900;
      letter-spacing: 0;
      line-height: 1.02;
      color: var(--ink);
    }
    .panel-body p { color: var(--ink-soft); font-weight: 700; }
    .panel-quote {
      border: 2px solid var(--line2);
      border-radius: 18px;
      box-shadow: 0 5px 0 var(--em);
      background: #fff;
    }
    .panel-quote p {
      font-family: var(--sans);
      font-style: normal;
      font-weight: 900;
      color: var(--yale);
    }
    .role-badge {
      background: var(--lime);
      border: 2px solid var(--lime2);
      color: var(--yale);
      box-shadow: 0 3px 0 var(--lime3);
      font-weight: 900;
    }
    .form-header h1 {
      font-weight: 900;
      letter-spacing: 0;
      color: var(--ink);
    }
    .form-header p,
    .form-group label,
    .form-footer { color: var(--ink-soft); font-weight: 700; }
    .form-group input {
      height: 46px;
      border: 2px solid var(--line2);
      border-radius: 12px;
      background: #fff;
      font-weight: 700;
    }
    .form-group input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(52,160,164,.12);
    }
    .btn-social {
      border: 2px solid var(--line2);
      border-radius: 12px;
      font-weight: 900;
      box-shadow: 0 3px 0 var(--line2);
      background: #fff;
    }
    .btn-social:hover { background: var(--paper-warm); border-color: var(--lime2); }
    .btn-submit {
      height: 46px;
      background: var(--teal);
      border: 2px solid var(--yale);
      border-radius: 14px;
      font-weight: 900;
      box-shadow: 0 4px 0 var(--yale);
      transition: transform .1s, box-shadow .1s, background .15s;
    }
    .btn-submit:hover {
      background: var(--teal2);
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--yale);
    }
    .forgot-link,
    .form-footer a { color: var(--teal2); font-weight: 900; }
    .divider::before, .divider::after { background: var(--line); height: 2px; }
    .divider span { color: var(--ink-muted); font-weight: 900; }
    .reset-panel h3 { font-weight: 900; letter-spacing: 0; }
    {% endif %}

  </style>
