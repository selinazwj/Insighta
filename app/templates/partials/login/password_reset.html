    <!-- PASSWORD RESET PANEL -->
    <div class="reset-panel {% if reset_open %}open{% endif %}" id="resetPanel">
      <h3>Reset password</h3>
      <p>Enter your email, get a verification code, and set a new password.</p>

      {% if reset_error %}
      <div class="error-box">{{ reset_error }}</div>
      {% endif %}

      {% if reset_success %}
      <div class="success-box">{{ reset_success }}</div>
      {% endif %}

      <form method="POST" action="/password-reset">
        <div class="form-group">
          <label>Email address</label>
          <input type="email" name="email" required placeholder="you@example.com"
            value="{{ reset_email or '' }}">
        </div>

        <div class="form-group">
          <label>Verification code</label>
          <div class="code-row">
            <input type="text" name="verification_code" id="resetVerificationCode" placeholder="6-digit code"
              maxlength="6" autocomplete="one-time-code" style="letter-spacing:4px;font-size:18px;font-weight:600;text-align:center;">
            <button type="button" class="btn-send-code" id="btnResetCode" onclick="sendResetCode()">
              Send Code
            </button>
          </div>
          <div class="code-hint" id="resetCodeHint"></div>
        </div>

        <div class="form-group">
          <label>New password</label>
          <input type="password" name="new_password" required placeholder="••••••••" minlength="6">
        </div>
        <div class="form-group">
          <label>Confirm new password</label>
          <input type="password" name="confirm_password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-submit">Reset Password →</button>
      </form>
