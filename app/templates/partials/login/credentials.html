    <!-- LOGIN FORM -->
    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{ login_next or '' }}">
      <input type="hidden" name="role" value="{{ login_role or '' }}">
      <div class="form-group">
        <label for="loginIdentifier">Email address or username</label>
        <input type="text" id="loginIdentifier" name="email" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="you@example.com or username"
          value="{{ login_email or '' }}">
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <span class="forgot-link" onclick="toggleReset()">Forgot password?</span>
      <button type="submit" class="btn-submit">Sign In →</button>
    </form>

    <p class="form-footer">Don't have an account? <a href="/register{% if login_role %}?role={{ login_role }}{% endif %}">Create one free</a></p>
