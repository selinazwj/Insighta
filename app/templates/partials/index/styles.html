<style>
    :root {
      --green:   #3b7c4f;
      --green-d: #2a5c39;
      --green-l: #e8f2eb;
      --green-m: #c2deca;
      --ink:     #1a1a18;
      --ink2:    #39443b;
      --ink3:    #596358;
      --ink4:    #616a5f;
      --bg:      #ffffff;
      --bg2:     #fafaf8;
      --bg3:     #f5f3ee;
      --line:    #eeece6;
      --line2:   #e0ddd6;
      --serif:   Georgia, 'Times New Roman', serif;
      --sans:    'DM Sans', system-ui, sans-serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--sans); font-weight: 500; background: var(--bg); color: var(--ink); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    .skip-link { position:fixed; top:8px; left:16px; z-index:600; transform:translateY(-160%); padding:12px 18px; border-radius:8px; background:var(--ink); color:#fff; }
    .skip-link:focus { transform:none; }
    #how, #main-content { scroll-margin-top:88px; }

    /* ── NAV ── */
    .nav {
      position: sticky; top: 0; z-index: 200;
      min-height: 64px; padding: 0 48px; gap:16px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.9); backdrop-filter: blur(20px);
      border-bottom: 0.5px solid var(--line);
    }
    .nav-logo { display:inline-flex; align-items:center; min-height:44px; font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--ink); text-decoration: none; letter-spacing: -0.2px; }
    .nav-logo span { color: var(--green); }
    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-links a { display:inline-flex; align-items:center; min-height:44px; min-width:44px; font-size: 14px; color: var(--ink3); text-decoration: none; font-weight: 500; transition: color .15s; }
    .nav-links a:hover { color: var(--ink); }
    .role-switch {
      display: inline-grid; grid-template-columns: 1fr 1fr; gap: 2px;
      padding: 3px; border: 0.5px solid var(--line2); border-radius: 22px;
      background: var(--bg2); position: relative; overflow: hidden;
    }
    .role-tab {
      border: none; background: transparent; color: var(--ink3);
      font: 600 13px var(--sans); min-height:44px; padding: 8px 12px; border-radius: 22px;
      cursor: pointer; position: relative; z-index: 1; transition: color .18s, background .18s;
    }
    .role-tab.active { background: var(--green); color: white; }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .nav-signin { display:inline-flex; align-items:center; min-height:44px; min-width:44px; font-size: 14px; color: var(--ink2); text-decoration: none; font-weight: 500; white-space:nowrap; }
    .nav-cta {
      display:inline-flex; align-items:center; min-height:44px; white-space:nowrap;
      font-size: 14px; font-weight: 600; color: #fff;
      background: var(--green); padding: 8px 18px;
      border-radius: 20px; text-decoration: none;
      transition: background .15s;
    }
    .nav-cta:hover { background: var(--green-d); }

    .theme-wipe {
      position: fixed; inset: 0; z-index: 450; pointer-events: none;
      background: linear-gradient(90deg, rgba(255,255,255,0), var(--green-l), var(--green));
      transform: translateX(100%);
      opacity: 0;
    }
    .theme-wipe.run {
      animation: wipe-left .58s cubic-bezier(.22,.8,.24,1);
    }
    @keyframes wipe-left {
      0% { transform: translateX(100%); opacity: 0; }
      18% { opacity: .95; }
      55% { transform: translateX(0); opacity: .92; }
      100% { transform: translateX(-100%); opacity: 0; }
    }

    /* ── HERO ── */
    .hero { padding: 96px 48px 80px; border-bottom: 0.5px solid var(--line); }
    .hero-inner { max-width: 1040px; margin: 0 auto; }
    .hero-kicker {
      font-size: 12px; font-weight: 500; color: var(--green);
      display: flex; align-items: center; gap: 8px; margin-bottom: 20px;
    }
    .hero-kicker::before { content: ''; display: inline-block; width: 18px; height: 1.5px; background: var(--green); }
    .hero-h1 {
      font-family:var(--serif); font-size:clamp(42px,4.6vw,56px); font-weight:700; color:var(--ink);
      line-height: 1.12; letter-spacing: -.025em; margin-bottom: 24px; text-wrap:balance;
      max-width: 680px;
    }
    .hero-h1 strong { font-weight: 700; }
    .keep-together { white-space:nowrap; }
    .mode-text { transition: opacity .18s ease, transform .18s ease; }
    body.is-switching .mode-text { opacity: 0; transform: translateX(-8px); }
    .hero-sub {
      font-size: 17px; color: var(--ink2); line-height: 1.7;
      max-width: 440px; margin-bottom: 36px; font-weight: 500;
    }
    .hero-actions { display: flex; align-items: center; gap: 14px; margin-bottom: 72px; }
    .btn-hero {
      font-size: 14px; font-weight: 600; color: #fff; min-height:48px;
      background: var(--green); padding: 12px 26px;
      border-radius: 24px; text-decoration: none; cursor: pointer; border: none;
      font-family: var(--sans); transition: background .15s;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-hero:hover { background: var(--green-d); }
    .btn-hero-ghost {
      font-size: 14px; font-weight: 500; color: var(--ink2); min-height:44px;
      text-decoration: none; display: flex; align-items: center; gap: 5px;
      transition: color .15s;
    }
    .btn-hero-ghost:hover { color: var(--ink); }
    .btn-hero-ghost svg { width: 14px; height: 14px; }

    /* Hero stats */
    /* ive added left padding so the text isnt hugging the divider lines, and bumped the sizes a touch */
    .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 0.5px solid var(--line); border-bottom: 0.5px solid var(--line); }
    .hero-stat { padding: 32px 32px 32px 28px; border-right: 0.5px solid var(--line); }
    .hero-stat { min-width: 0; }
    .hero-stat:first-child { padding-left: 0; }
    .hero-stat:last-child { border-right: none; padding-right: 0; }
    .hs-n { font-size: 36px; font-weight: 300; color: var(--green); letter-spacing: -1px; margin-bottom: 6px; }
    .hs-l { font-size: 14px; color: var(--ink2); font-weight: 500; margin-bottom: 3px; }
    .hs-s { font-size: 12px; color: var(--ink4); }

    /* ── HOW IT WORKS ── */
    .section { max-width: 1040px; margin: 0 auto; padding: 80px 48px; }
    .section-kicker { font-size: 12px; font-weight: 500; color: var(--green); display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .section-kicker::before { content: ''; display: inline-block; width: 18px; height: 1.5px; background: var(--green); }
    .section-h { font-family:var(--serif); font-size:36px; font-weight:700; color:var(--ink); letter-spacing:-.025em; line-height:1.18; margin-bottom:12px; }
    .section-h strong { font-weight: 700; }
    .section-sub { font-size: 16px; color: var(--ink2); line-height: 1.7; max-width: 480px; margin-bottom: 40px; }

    .how-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 0.5px solid var(--line); border-radius: 12px; overflow: hidden; }
    .how-col { }
    .how-col-head {
      padding: 20px 28px; border-bottom: 0.5px solid var(--line);
      display: flex; align-items: center; gap: 10px;
      background: var(--bg3);
    }
    .how-col:first-child { border-right: 0.5px solid var(--line); }
    .how-col-icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .how-col-icon svg { width: 14px; height: 14px; color: #fff; }
    .how-col-title { font-size: 13px; font-weight: 600; color: var(--ink); }
    .how-col-sub { font-size: 11px; color: var(--ink3); margin-top: 1px; }
    .how-step { padding: 20px 28px; border-bottom: 0.5px solid var(--line); display: flex; gap: 14px; align-items: flex-start; background: var(--bg); }
    .how-step:last-child { border-bottom: none; }
    .how-n { width: 20px; height: 20px; border-radius: 50%; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--ink3); flex-shrink: 0; margin-top: 1px; }
    .how-t { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
    .how-b { font-size: 12px; color: var(--ink3); line-height: 1.6; }

    /* ── FEATURES ── */
    .features-bg { background: var(--bg2); border-top: 0.5px solid var(--line); border-bottom: 0.5px solid var(--line); }
    .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
    .feature-card { padding: 28px 28px; border-right: 0.5px solid var(--line); border-bottom: 0.5px solid var(--line); }
    .feature-card:nth-child(3n) { border-right: none; }
    .feature-card:nth-child(n+4) { border-bottom: none; }
    .feature-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; background: var(--bg3); }
    .feature-icon svg { width: 15px; height: 15px; }
    .feature-t { font-size: 16px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
    .feature-b { font-size: 14px; color: var(--ink2); line-height: 1.7; }

    /* ── TESTIMONIAL ── */
    .quote-section { padding: 80px 48px; border-bottom: 0.5px solid var(--line); }
    .quote-inner { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .quote-card { background: var(--bg2); border: 0.5px solid var(--line); border-radius: 10px; padding: 28px; }
    .quote-text { font-family: var(--serif); font-size: 22px; font-weight:700; color: var(--ink); line-height: 1.35; margin-bottom: 12px; }
    .quote-attr { font-size: 14px; color: var(--ink2); font-weight: 500; display: flex; align-items: center; gap: 8px; }
    .quote-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

    /* ── FOOTER ── */
    .footer { padding: 32px 48px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; border-top: 0.5px solid var(--line); }
    .footer-logo { font-size: 14px; font-weight: 600; color: var(--ink2); }
    .footer-logo span { color: var(--green); }
    .footer-links { display: flex; flex-wrap:wrap; gap: 4px 20px; }
    .footer-links a { display:inline-flex; align-items:center; min-height:44px; min-width:44px; font-size: 14px; color: var(--ink3); text-decoration: none; transition: color .15s; }
    .footer-links a:hover { color: var(--ink); }
    .footer-copy { width: 100%; font-size: 12px; line-height:1.6; color: var(--ink3); border-top: 0.5px solid var(--line); padding-top: 16px; margin-top: 8px; }
    .quote-attr a { display:inline-flex; align-items:center; min-height:44px; line-height:1.6; color: inherit; text-underline-offset: 3px; }
    a:focus-visible, button:focus-visible, select:focus-visible { outline: 3px solid var(--green-d); outline-offset: 4px; }

    /* ── MODAL — ROLE PICKER ── */
    .modal-bg {
      display: none; position: fixed; inset: 0; z-index: 500;
      background: rgba(26,26,24,.5); backdrop-filter: blur(8px);
      align-items: center; justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--bg); border-radius: 16px;
      border: 0.5px solid var(--line2);
      width: 100%; max-width: 480px; margin: 20px;
      animation: modal-in .18s ease;
      overflow: hidden;
    }
    @keyframes modal-in { from { transform: translateY(12px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }

    .modal-head { padding: 24px 28px 20px; border-bottom: 0.5px solid var(--line); display: flex; align-items: flex-start; justify-content: space-between; }
    .modal-title { font-size: 17px; font-weight: 600; color: var(--ink); letter-spacing: -0.2px; margin-bottom: 4px; }
    .modal-sub { font-size: 13px; color: var(--ink3); }
    .modal-close { background: none; border: none; cursor: pointer; color: var(--ink3); font-size: 18px; line-height: 1; padding: 2px; margin-top: -2px; }
    .modal-close:hover { color: var(--ink); }

    .modal-body { padding: 24px 28px 28px; }
    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .role-card {
      border: 0.5px solid var(--line2); border-radius: 10px;
      padding: 18px 16px; cursor: pointer; background: var(--bg);
      transition: border-color .15s, background .15s; text-align: left;
      position: relative;
    }
    .role-card:hover { border-color: var(--green-m); background: var(--green-l); }
    .role-card.sel { border-color: var(--green); background: var(--green-l); }
    .role-card.sel::after {
      content: ''; position: absolute; top: 12px; right: 12px;
      width: 7px; height: 7px; border-radius: 50%; background: var(--green);
    }
    .role-icon { width: 32px; height: 32px; border-radius: 7px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; }
    .role-icon svg { width: 16px; height: 16px; color: #fff; }
    .role-name { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
    .role-desc { font-size: 11px; color: var(--ink3); line-height: 1.5; }

    .modal-divider { height: 0.5px; background: var(--line); margin: 0 0 20px; }

    .form-submit { width: 100%; height: 42px; background: var(--green); color: #fff; border: none; border-radius: 8px; font-family: var(--sans); font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s; margin-top: 4px; }
    .form-submit:hover { background: var(--green-d); }
    .auth-choice-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .auth-choice-actions .form-submit { display: flex; align-items: center; justify-content: center; text-decoration: none; margin-top: 0; }
    .auth-choice-actions .form-submit.secondary { background: #fff; color: var(--green); border: 1px solid var(--green-m); }
    .auth-choice-actions .form-submit.secondary:hover { background: var(--green-l); }

    /* fade in */
    .reveal { opacity: 0; transform: translateY(16px); animation: ri .5s ease forwards; }
    .d1 { animation-delay: .08s; } .d2 { animation-delay: .18s; } .d3 { animation-delay: .28s; }
    @keyframes ri { to { opacity: 1; transform: none; } }

    body.participant-mode {
      --lime: #d9ed92;
      --lime2: #b5e48c;
      --lime3: #99d98c;
      --em: #76c893;
      --teal: #34a0a4;
      --teal2: #168aad;
      --ocean: #1a759f;
      --yale: #184e77;
      --green: #14777b;
      --green-d: #12647e;
      --green-l: #eefbf7;
      --green-m: var(--lime2);
      --bg2: #fcfff5;
      --bg3: #f4fbdf;
      --line: #d9efc8;
      --line2: #b8e9ad;
      --ink: #12324a;
      --ink2: #2b5261;
      --ink3: #466774;
      --ink4: #4b6670;
    }
    body.participant-mode .hero {
      background:
        radial-gradient(circle at 86% 18%, rgba(217,237,146,.9), rgba(217,237,146,0) 20%),
        linear-gradient(110deg, rgba(252,255,245,.92), rgba(244,251,223,.8) 48%, rgba(82,182,154,.22));
    }
    body.participant-mode .role-tab.active {
      background: var(--green-d);
    }
    body.participant-mode .nav-logo,
    body.participant-mode .nav-links a,
    body.participant-mode .nav-signin,
    body.participant-mode .nav-cta,
    body.participant-mode .hero-kicker,
    body.participant-mode .hero-sub,
    body.participant-mode .btn-hero,
    body.participant-mode .btn-hero-ghost,
    body.participant-mode .hero-stat,
    body.participant-mode .section {
      font-family: var(--sans);
      letter-spacing: 0;
    }
    body.participant-mode .nav-logo { font-size: 18px; font-weight: 900; }
    body.participant-mode .role-tab,
    body.participant-mode .nav-signin,
    body.participant-mode .nav-cta { font-weight: 900; }
    body.participant-mode .hero-kicker {
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
    }
    body.participant-mode .hero-h1 {
      font-size:clamp(42px,4.6vw,56px);
      line-height:1.12;
      font-weight:700;
      letter-spacing:-.025em;
    }
    body.participant-mode .hero-h1 strong { font-weight:700; color:var(--green-d); }
    body.participant-mode .hero-sub {
      color: var(--ink2);
      font-size: 17px;
      font-weight: 500;
    }
    body.participant-mode .btn-hero {
      border: 2px solid var(--yale);
      box-shadow: 0 4px 0 var(--yale);
      border-radius: 14px;
      font-weight: 900;
      background: var(--green);
      transition: transform .1s, box-shadow .1s, background .15s;
    }
    body.participant-mode .btn-hero:hover { transform: translateY(2px); box-shadow: 0 2px 0 var(--yale); background: var(--green-d); }
    body.participant-mode .nav-cta,
    body.participant-mode .role-tab.active {
      box-shadow: 0 3px 0 var(--lime3);
      border: 1.5px solid var(--lime2);
    }
    body.participant-mode .hero-stat {
      background: #fff;
      border-right: 2px solid var(--line);
      padding-left: 18px;
      box-shadow: inset 0 -4px 0 rgba(118,200,147,.22);
    }
    body.participant-mode .hs-n { color: var(--teal2); font-weight: 900; }

    /* responsive */
    @media (max-width:860px) { .nav-links { display:none; } }
    @media (max-width: 860px) {
      .nav { padding: 0 24px; } .hero { padding: 64px 24px 56px; } .hero-h1 { font-size: 40px; }
      .hero-stats { grid-template-columns: repeat(2, 1fr); }
      /* 2-col layout: odd stats start each row, so align them with the left edge like the first */
      .hero-stat:nth-child(odd) { padding-left: 0; }
      .hero-stat:nth-child(even) { border-right: none; padding-right: 0; }
      .section { padding: 56px 24px; } .how-grid { grid-template-columns: 1fr; }
      .how-col:first-child { border-right: none; border-bottom: 0.5px solid var(--line); }
      .features-grid { grid-template-columns: 1fr 1fr; }
      .feature-card:nth-child(2n) { border-right: none; }
      .feature-card:nth-child(n+4) { border-bottom: none; }
      .quote-inner { grid-template-columns: 1fr; }
      .footer { padding: 24px; }
      .quote-section { padding: 56px 24px; }
    }
    @media (max-width: 560px) {
      .nav { height: auto; min-height: 56px; padding: 10px 18px; gap: 10px; flex-wrap: wrap; }
      #how, #main-content { scroll-margin-top:144px; }
      .hero-h1, body.participant-mode .hero-h1 { font-size:clamp(32px,9.6vw,40px); }
      .nav-links { display: none; }
      .role-switch { order: 3; width: 100%; }
      .role-tab { padding: 7px 10px; }
      .nav-right { margin-left: auto; }
      .hero-stats { grid-template-columns: 1fr 1fr; }
      .hero-actions { flex-direction: column; align-items: stretch; gap: 16px; margin-bottom: 36px; }
      .btn-hero, .btn-hero-ghost { justify-content: center; min-height: 44px; }
      .hero-stat { padding: 22px 14px; }
      .hs-n { font-size: clamp(21px, 6vw, 28px); letter-spacing: -.5px; overflow-wrap: anywhere; }
      .hs-l { font-size: 13px; line-height: 1.45; }
      .hs-s { color: var(--ink3); line-height: 1.5; }
      .features-grid { grid-template-columns: 1fr; }
      .feature-card { border-right: none; border-bottom: 0.5px solid var(--line); }
      .feature-card:last-child { border-bottom: none; }
    }
    /* One animated overview; the section below shows the real operations. */
    .journey-hero-grid { display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:48px; align-items:center; }
    .journey-aside { min-width:0; margin-bottom:50px; --journey-progress:0%; }
    .journey-floating { border:.5px solid var(--line2); border-radius:13px; background:var(--bg); box-shadow:0 14px 35px -23px rgba(42,92,57,.35); animation:journey-drift 6s ease-in-out infinite; }
    .journey-floating.is-paused, .journey-floating:hover { animation-play-state:paused; }
    @keyframes journey-drift { 0%,100% { transform:translateY(3px); } 50% { transform:translateY(-5px); } }
    .journey-window { display:flex; align-items:center; gap:7px; border-bottom:.5px solid var(--line); padding:16px 20px; font-size:12px; color:var(--ink3); }
    .journey-window-dot { width:6px; height:6px; border-radius:50%; background:var(--green); }
    .journey-example { margin-left:auto; font-size:12px; }
    .journey-preview { padding:26px 24px 20px; min-height:254px; }
    .journey-panel { text-align:center; min-height:208px; display:flex; flex-direction:column; justify-content:center; align-items:center; animation:journey-panel-in .3s ease; }
    .journey-panel[hidden] { display:none; }
    @keyframes journey-panel-in { from {opacity:0;transform:translateY(4px)} to {opacity:1;transform:none} }
    .journey-value { font-size:23px; letter-spacing:-.6px; font-weight:600; margin:14px 0; }
    .journey-status { display:inline-block; color:var(--green); font-size:13px; margin-top:18px; line-height:1.6; }
    .journey-people { display:flex; align-items:center; justify-content:center; height:76px; gap:15px; }
    .journey-item { opacity:0; transform:translateY(12px) scale(.9); transition:opacity 1s ease,transform 1s ease; }
    .journey-item:first-child { opacity:1; transform:none; animation:journey-person-in 1s ease both; }
    .journey-preview:not([data-frame="0"]) .journey-item:nth-child(2),
    .journey-preview[data-frame="2"] .journey-item:nth-child(3) { opacity:1; transform:none; }
    .journey-person-icon { display:block; width:55px; height:62px; position:relative; animation:journey-person-float 4.8s ease-in-out infinite; }
    .journey-person-icon::before { content:''; position:absolute; width:21px; height:24px; border-radius:45% 45% 48% 48%; background:var(--green); left:17px; top:3px; }
