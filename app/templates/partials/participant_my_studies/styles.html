<style>
    :root {
      --lime:#d9ed92;--lime2:#b5e48c;--lime3:#99d98c;
      --em:#76c893;--teal:#34a0a4;--teal2:#168aad;
      --ocean:#1a759f;--baltic:#1e6091;--yale:#184e77;
      --ink:#12324a;--ink2:#2f5f6d;--ink3:#5f8390;
      --paper:#fcfff5;--paper2:#f4fbdf;--paper3:#eefbf7;
      --line:#d9efc8;--line2:#b8e9ad;
      --sans:'DM Sans',system-ui,sans-serif;
      --sidebar-w:220px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;}

    /* ── SIDEBAR ── */
    .sidebar{width:var(--sidebar-w);flex-shrink:0;background:#fff;border-right:2px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
    .sidebar-top{padding:20px 20px 16px;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
    .sidebar-logo{font-size:18px;font-weight:900;color:var(--ink);}
    .sidebar-logo span{color:var(--teal);}
    .earnings-pill{background:var(--lime);color:var(--yale);font-size:12px;font-weight:900;padding:5px 11px;border-radius:20px;border:2px solid var(--lime2);box-shadow:0 3px 0 var(--lime3);white-space:nowrap;}
    .sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:700;color:var(--ink3);cursor:pointer;text-decoration:none;transition:all .15s;border:2px solid transparent;}
    .nav-item:hover{background:var(--paper2);color:var(--ink2);}
    .nav-item.active{background:var(--paper2);color:var(--yale);border-color:var(--line);box-shadow:0 3px 0 var(--line2);}
    .nav-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
    .sidebar-bottom{padding:14px 10px;border-top:2px solid var(--line);}
    .user-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;text-decoration:none;transition:background .15s;}
    .user-row:hover{background:var(--paper2);}
    .avatar{width:34px;height:34px;border-radius:10px;background:var(--lime);color:var(--yale);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;border:2px solid var(--lime2);box-shadow:0 2px 0 var(--lime3);flex-shrink:0;}
    .user-name{font-size:13px;font-weight:700;color:var(--ink);}
    .user-sub{font-size:11px;color:var(--ink3);margin-top:1px;}

    /* ── MAIN ── */
    .main{flex:1;min-width:0;display:flex;flex-direction:column;}
    .topbar{background:rgba(246,251,236,0.9);backdrop-filter:blur(16px);border-bottom:2px solid var(--line);padding:0 32px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
    .topbar-title{font-size:17px;font-weight:900;color:var(--ink);}
    .content{flex:1;padding:28px 32px;max-width:900px;}

    /* ── SUMMARY ROW ── */
    .summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
    .summary-card{background:#fff;border:2px solid var(--line2);border-radius:14px;padding:16px 18px;box-shadow:0 4px 0 var(--em);display:flex;align-items:center;gap:14px;}
    .summary-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 0 rgba(0,0,0,.12);}
    .summary-icon svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;}
    .summary-num{font-size:26px;font-weight:900;color:var(--yale);letter-spacing:-0.5px;line-height:1;}
    .summary-lbl{font-size:12px;font-weight:700;color:var(--ink3);margin-top:3px;}

    /* ── TABS ── */
    .tabs{display:flex;gap:4px;margin-bottom:20px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px;box-shadow:0 3px 0 var(--line2);}
    .tab{flex:1;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:900;color:var(--ink3);cursor:pointer;border:2px solid transparent;text-align:center;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;}
    .tab:hover{background:var(--paper2);color:var(--ink2);}
    .tab.active{background:var(--teal);color:#fff;border-color:var(--yale);box-shadow:0 3px 0 var(--yale);}
    .tab-badge{font-size:11px;font-weight:900;background:rgba(255,255,255,.25);padding:1px 7px;border-radius:10px;}
    .tab:not(.active) .tab-badge{background:var(--paper2);color:var(--ink3);}

    /* ── STUDY ROWS ── */
    .study-list{display:flex;flex-direction:column;gap:10px;}

    .study-row{background:#fff;border:2px solid var(--line2);border-radius:16px;padding:18px 20px;box-shadow:0 4px 0 var(--em);transition:transform .12s;}
    .study-row:hover{transform:translateY(-1px);}
    .study-row.completed{border-color:var(--line);box-shadow:0 3px 0 var(--line2);}
    .study-row.skipped{border-color:var(--line);background:var(--paper);box-shadow:0 3px 0 var(--line2);opacity:.7;}

    .row-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:12px;}
    .row-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 0 rgba(0,0,0,.1);}
    .row-icon svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;}
    .row-info{flex:1;min-width:0;}
    .row-title{font-size:15px;font-weight:900;color:var(--ink);margin-bottom:3px;line-height:1.3;}
    .row-title a{color:inherit;text-decoration:none;}
    .row-title a:hover{text-decoration:underline;}
    .row-title a:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:3px;}
    .row-desc{font-size:12px;color:var(--ink3);font-weight:500;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .row-right{text-align:right;flex-shrink:0;}
    .row-reward{font-size:20px;font-weight:900;color:var(--teal2);white-space:nowrap;}
    .row-reward.pending{color:var(--ink3);}
    .row-reward.paid{color:var(--teal);}

    .row-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
    .meta-pill{font-size:11px;font-weight:800;color:var(--ink2);background:var(--paper2);border:1.5px solid var(--line);padding:4px 9px;border-radius:20px;display:flex;align-items:center;gap:4px;}
    .meta-pill svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}

    .status-pill{font-size:11px;font-weight:900;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
    .status-pill svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5;}
    .status-pill.done{background:var(--paper3);color:var(--teal);border:1.5px solid var(--t100,#9FE1CB);}
    .status-pill.pending{background:#fff3e0;color:#b35c00;border:1.5px solid #f0c080;}
    .status-pill.scheduled{background:#eaf4ff;color:#245b8a;border:1.5px solid #9dc7e8;}
    .status-pill.paid{background:var(--paper2);color:var(--yale);border:1.5px solid var(--lime2);}
    .status-pill.skipped{background:var(--paper);color:var(--ink3);border:1.5px solid var(--line);}

    .row-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;max-width:100%;}
    .btn-sm{text-decoration:none;padding:7px 14px;border-radius:10px;font-family:var(--sans);font-size:12px;font-weight:900;cursor:pointer;border:2px solid;transition:transform .1s,box-shadow .1s;display:flex;align-items:center;gap:5px;}
    .btn-sm svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;}
    .btn-sm.primary{background:var(--teal);color:#fff;border-color:var(--yale);box-shadow:0 3px 0 var(--yale);}
    .btn-sm.primary:hover{transform:translateY(1px);box-shadow:0 2px 0 var(--yale);}
    .btn-sm.ghost{background:#fff;color:var(--ink3);border-color:var(--line);box-shadow:0 3px 0 var(--line2);}
    .btn-sm.ghost:hover{transform:translateY(1px);box-shadow:0 2px 0 var(--line2);}

    /* empty */
    .empty{text-align:center;padding:64px 24px;}
    .empty-icon{width:56px;height:56px;border-radius:18px;background:var(--paper2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 4px 0 var(--line2);}
    .empty-icon svg{width:26px;height:26px;stroke:var(--teal);fill:none;stroke-width:1.75;}
    .empty h3{font-size:18px;font-weight:900;color:var(--ink);margin-bottom:6px;}
    .empty p{font-size:13px;color:var(--ink3);font-weight:500;line-height:1.6;margin-bottom:20px;}
    .btn-go{display:inline-flex;align-items:center;gap:7px;background:var(--teal);color:#fff;border:2px solid var(--yale);border-radius:12px;padding:10px 22px;font-family:var(--sans);font-size:13px;font-weight:900;text-decoration:none;box-shadow:0 4px 0 var(--yale);}

    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px;}
  </style>
