<script>document.getElementById('couponAdmin').addEventListener('submit',async function(event){event.preventDefault();const button=this.querySelector('button');button.disabled=true;const result=document.getElementById('result');try{const response=await fetch('/admin/api/wallet/coupons',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin_key:{{ admin_key|tojson }},code:document.getElementById('code').value,amount:document.getElementById('amount').value,expires_at:document.getElementById('expiry').value+'Z',max_redemptions:document.getElementById('redemptions').value})});const body=await response.json();if(!response.ok)throw new Error(body.detail||'Could not issue coupon');result.textContent=`Created ${body.code}: $${(body.amount_cents/100).toFixed(2)} per redemption, expires ${body.expires_at}.`;}catch(error){result.textContent=error.message;}finally{button.disabled=false;}});</script>
