<style>
    :root {
      --lime:#d9ed92;--lime2:#b5e48c;--lime3:#99d98c;
      --em:#76c893;--teal:#34a0a4;--teal2:#168aad;
      --ocean:#1a759f;--baltic:#1e6091;--yale:#184e77;
      --ink:#12324a;--ink2:#2f5f6d;--ink3:#5f8390;
      --paper:#fcfff5;--paper2:#f4fbdf;--paper3:#eefbf7;
      --line:#d9efc8;--line2:#b8e9ad;
      --sans:'DM Sans',system-ui,sans-serif;
      --sidebar-w:220px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;}

    /* ── SIDEBAR (shared) ── */
    .sidebar{width:var(--sidebar-w);flex-shrink:0;background:#fff;border-right:2px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
    .sidebar-top{padding:20px 20px 16px;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
    .sidebar-logo{font-size:18px;font-weight:900;color:var(--ink);}
    .sidebar-logo span{color:var(--teal);}
    .earnings-pill{background:var(--lime);color:var(--yale);font-size:12px;font-weight:900;padding:5px 11px;border-radius:20px;border:2px solid var(--lime2);box-shadow:0 3px 0 var(--lime3);white-space:nowrap;}
    .sidebar-nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:700;color:var(--ink3);cursor:pointer;text-decoration:none;transition:all .15s;border:2px solid transparent;}
    .nav-item:hover{background:var(--paper2);color:var(--ink2);}
    .nav-item.active{background:var(--paper2);color:var(--yale);border-color:var(--line);box-shadow:0 3px 0 var(--line2);}
    .nav-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
    .sidebar-bottom{padding:14px 10px;border-top:2px solid var(--line);}
    .user-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;text-decoration:none;transition:background .15s;}
    .user-row:hover{background:var(--paper2);}
    .avatar{width:34px;height:34px;border-radius:10px;background:var(--lime);color:var(--yale);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;border:2px solid var(--lime2);box-shadow:0 2px 0 var(--lime3);flex-shrink:0;}
    .user-name{font-size:13px;font-weight:700;color:var(--ink);}
    .user-sub{font-size:11px;color:var(--ink3);margin-top:1px;}

    /* ── MAIN ── */
    .main{flex:1;min-width:0;display:flex;flex-direction:column;}
    .topbar{background:rgba(246,251,236,0.9);backdrop-filter:blur(16px);border-bottom:2px solid var(--line);padding:0 32px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
    .topbar-title{font-size:17px;font-weight:900;color:var(--ink);}
    .content{flex:1;padding:28px 32px;max-width:860px;}

    /* balance card */
    .balance-card{background:var(--teal2);border:2px solid var(--yale);border-radius:20px;padding:28px 28px 24px;margin-bottom:20px;box-shadow:0 6px 0 var(--yale);position:relative;overflow:hidden;}
    .balance-card::before{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06);}
    .balance-lbl{font-size:11px;font-weight:900;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
    .balance-amt{font-size:52px;font-weight:900;color:#fff;letter-spacing:-2px;line-height:1;margin-bottom:4px;}
    .balance-sub{font-size:13px;color:rgba(255,255,255,.6);font-weight:700;margin-bottom:22px;}
    .withdraw-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--yale);border:2px solid rgba(255,255,255,.4);border-radius:12px;padding:11px 22px;font-family:var(--sans);font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--yale);transition:transform .1s,box-shadow .1s;}
    .withdraw-btn:hover{transform:translateY(2px);box-shadow:0 2px 0 var(--yale);}
    .withdraw-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--yale);}
    .withdraw-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
    .setup-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--yale);border:2px solid rgba(255,255,255,.4);border-radius:12px;padding:11px 22px;font-family:var(--sans);font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 var(--yale);text-decoration:none;}

    /* stat row */
    .stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:24px;}
    .stat-card{background:#fff;border:2px solid var(--line2);border-radius:14px;padding:16px 18px;box-shadow:0 4px 0 var(--em);}
    .stat-n{font-size:26px;font-weight:900;color:var(--yale);letter-spacing:-0.5px;}
    .stat-l{font-size:12px;font-weight:700;color:var(--ink3);margin-top:3px;}

    /* history */
    .history-box{background:#fff;border:2px solid var(--line2);border-radius:18px;overflow:hidden;box-shadow:0 4px 0 var(--em);}
    .history-head{padding:16px 20px;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
    .history-head-title{font-size:14px;font-weight:900;color:var(--ink);}
    .history-head-sub{font-size:12px;color:var(--ink3);font-weight:700;}
    .history-row{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1.5px solid var(--line);}
    .history-row:last-child{border-bottom:none;}
    .h-left{}
    .h-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px;}
    .h-date{font-size:12px;color:var(--ink3);font-weight:500;}
    .h-right{text-align:right;}
    .h-amt{font-size:15px;font-weight:900;color:var(--teal2);}
    .h-amt.pending{color:var(--ink3);}
    .h-status{font-size:11px;font-weight:700;margin-top:2px;}
    .h-status.pending{color:var(--ink3);}
    .h-status.paid{color:var(--teal);}
    .empty-history{padding:40px;text-align:center;font-size:14px;color:var(--ink3);font-weight:700;}

    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px;}
  </style>
