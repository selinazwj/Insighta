<style>
    :root {
      --ink: #184e77;
      --ink-soft: #37657f;
      --line: rgba(24, 78, 119, 0.14);
      --bg: #f6fbf8;
      --panel: #ffffff;
      --mint: #b5e48c;
      --teal: #34a0a4;
      --blue: #1a759f;
      --deep: #184e77;
      --shadow: 0 18px 60px rgba(24, 78, 119, 0.12);
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(181, 228, 140, 0.34), transparent 32%),
        linear-gradient(140deg, #f8fff7 0%, #eef9f6 48%, #edf7fb 100%);
    }
    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 5vw, 72px);
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: 0; color: var(--deep); }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(145deg, var(--teal), var(--blue));
      display: grid; place-items: center; color: white; font-weight: 900;
      box-shadow: 0 10px 24px rgba(52, 160, 164, 0.24);
    }
    .top-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .ghost-link, .btn {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.88);
      color: var(--deep);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 750;
      text-decoration: none;
      cursor: pointer;
      font-family: var(--sans);
    }
    .btn-primary {
      border-color: transparent;
      color: white;
      background: linear-gradient(135deg, var(--teal), var(--blue));
      box-shadow: 0 14px 28px rgba(26, 117, 159, 0.22);
    }
    .layout {
      width: min(1120px, calc(100% - 36px));
      margin: 42px auto 64px;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.65fr);
      gap: 24px;
      align-items: start;
    }
    .hero, .side-panel, .details {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .hero { overflow: hidden; }
    .poster {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 7;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(181, 228, 140, 0.7), rgba(52, 160, 164, 0.55), rgba(26, 117, 159, 0.72));
      display: flex;
      align-items: flex-end;
      padding: 28px;
      color: white;
    }
    .poster-title { position: relative; z-index: 1; max-width: 760px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 7px 12px;
      background: rgba(255, 255, 255, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.34);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    h1 {
      margin: 16px 0 0;
      font-size: clamp(32px, 5vw, 58px);
      line-height: 0.96;
      letter-spacing: 0;
    }
    .hero-body { padding: 28px; }
    .summary {
      font-size: 17px;
      line-height: 1.65;
      color: var(--ink-soft);
      margin: 0;
      white-space: pre-wrap;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }
    .meta {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fbfefd;
      min-height: 86px;
    }
    .meta-label { font-size: 12px; text-transform: uppercase; font-weight: 800; color: #5a8297; letter-spacing: 0.06em; }
    .meta-value { margin-top: 8px; font-size: 18px; font-weight: 850; color: var(--deep); overflow-wrap: anywhere; }
    .side-panel { padding: 22px; position: sticky; top: 96px; }
    .cta-title { font-size: 20px; font-weight: 850; margin: 0 0 8px; }
    .cta-copy { margin: 0 0 18px; color: var(--ink-soft); line-height: 1.55; }
    .cta-stack { display: grid; gap: 10px; }
    .cta-stack .btn, .cta-stack .ghost-link { text-align: center; width: 100%; }
    .status-note {
      border-radius: 8px;
      padding: 12px 14px;
      background: rgba(181, 228, 140, 0.28);
      color: var(--deep);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 14px;
    }
    .slots { display: grid; gap: 8px; margin: 10px 0 16px; }
    .slot-btn {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 11px 12px;
      color: var(--deep);
      text-align: left;
      font: 750 14px var(--sans);
      cursor: pointer;
    }
    .slot-btn:hover { border-color: var(--teal); background: #f6fffb; }
    .slot-btn.selected { border-color: var(--teal); background: rgba(181, 228, 140, 0.36); color: var(--deep); }
    .slot-btn[disabled] { opacity: .45; cursor: not-allowed; background: #f5f5f3; color: #8a8a82; }
    .slot-helper { margin: 2px 0 10px; color: var(--ink-soft); font-size: 13px; font-weight: 700; line-height: 1.45; }
    .details { padding: 24px 28px; margin-top: 24px; }
    .details h2 { margin: 0 0 14px; font-size: 20px; letter-spacing: 0; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fbfefd;
      padding: 8px 11px;
      font-size: 13px;
      font-weight: 750;
      color: var(--ink-soft);
    }
    .tag.niche { width:100%; border-radius:8px; border-color:#f3a6a6; background:#fff1f1; color:#8f3030; font-weight:850; line-height:1.45; }
    .tag.benefits { width:100%; border-radius:8px; border-color:#99d98c; background:#f2fbec; color:#245f46; font-weight:850; line-height:1.45; }
    .fine-print { margin-top: 16px; color: #6f8fa0; font-size: 13px; line-height: 1.55; }
    .study-breadcrumbs {
      width: min(1120px, calc(100% - 36px));
      margin: 24px auto -18px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: #5a8297;
      font-size: 13px;
    }
    .study-breadcrumbs a { color: inherit; text-decoration: none; }
    .study-breadcrumbs a:hover { color: var(--teal); }
    .study-footer {
      width: min(1120px, calc(100% - 36px));
      margin: -28px auto 36px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      color: #6f8fa0;
      font-size: 13px;
    }
    .study-footer nav { display: flex; gap: 14px; flex-wrap: wrap; }
    .study-footer a { color: inherit; text-underline-offset: 3px; }
    a:focus-visible, button:focus-visible { outline: 3px solid rgba(52, 160, 164, 0.34); outline-offset: 3px; }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; margin-top: 24px; }
      .side-panel { position: static; }
      .meta-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .poster { aspect-ratio: 1.05 / 1; padding: 22px; }
      .topbar { height: auto; min-height: 68px; gap: 12px; align-items: flex-start; padding-top: 16px; padding-bottom: 16px; }
    }
  </style>
