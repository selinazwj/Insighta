<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recruitment credit coupons | Insighta Admin</title>{% include "_seo_head.html" %}<link rel="stylesheet" href="/static/seo_public.css"></head><body><main class="public-shell prose"><a href="/admin">Admin console</a><h1>Recruitment credit coupons</h1><p>Issue expiring, non-refundable credit that can cover platform recruitment fees only. A code may be redeemed once per account, within its total redemption limit.</p><form id="couponAdmin"><p><label>Coupon code (6–64 letters, digits, underscores or hyphens)<br><input id="code" minlength="6" maxlength="64" required></label></p><p><label>Credit per redemption (USD)<br><input id="amount" type="number" min="0.01" max="999999.99" step="0.01" required></label></p><p><label>Expires at (UTC)<br><input id="expiry" type="datetime-local" required></label></p><p><label>Maximum total redemptions<br><input id="redemptions" type="number" min="1" max="100000" step="1" value="1" required></label></p><button type="submit">Create coupon</button></form><p id="result" role="status"></p></main><script>document.getElementById('couponAdmin').addEventListener('submit',async function(event){event.preventDefault();const button=this.querySelector('button');button.disabled=true;const result=document.getElementById('result');try{const response=await fetch('/admin/api/wallet/coupons',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin_key:{{ admin_key|tojson }},code:document.getElementById('code').value,amount:document.getElementById('amount').value,expires_at:document.getElementById('expiry').value+'Z',max_redemptions:document.getElementById('redemptions').value})});const body=await response.json();if(!response.ok)throw new Error(body.detail||'Could not issue coupon');result.textContent=`Created ${body.code}: $${(body.amount_cents/100).toFixed(2)} per redemption, expires ${body.expires_at}.`;}catch(error){result.textContent=error.message;}finally{button.disabled=false;}});</script></body></html>
