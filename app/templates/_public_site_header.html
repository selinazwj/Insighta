{% set site_path = request.url.path %}
{% set site_role = 'participant' if site_path.startswith('/studies') else 'researcher' %}
<header class="site-nav" data-site-nav>
  <a class="site-logo" href="/" aria-label="Insighta home">Insight<span>a</span></a>
  <nav class="site-links" id="site-menu" aria-label="Main navigation">
    <a href="/"{% if site_path == '/' %} aria-current="page"{% endif %}>Home</a>
    <a href="/studies"{% if site_path.startswith('/studies') %} aria-current="page"{% endif %}>Browse studies</a>
    <a href="/how-it-works"{% if site_path == '/how-it-works' %} aria-current="page"{% endif %}>How it works</a>
    <a href="/about"{% if site_path == '/about' %} aria-current="page"{% endif %}>About</a>
    <a href="/pricing"{% if site_path == '/pricing' %} aria-current="page"{% endif %}>Pricing</a>
  </nav>
  <div class="site-role-switch" role="group" aria-label="Choose Insighta side">
    <button class="role-tab{% if site_role == 'researcher' %} active{% endif %}" id="tab-researcher" type="button" data-site-role="researcher" aria-pressed="{{ 'true' if site_role == 'researcher' else 'false' }}">Researcher</button>
    <button class="role-tab{% if site_role == 'participant' %} active{% endif %}" id="tab-participant" type="button" data-site-role="participant" aria-pressed="{{ 'true' if site_role == 'participant' else 'false' }}">Participant</button>
  </div>
  <div class="site-actions">
    <a class="site-signin mode-login-link" href="/login?role={{ site_role }}">Sign in</a>
    <a class="site-cta mode-register-link" href="/register?role={{ site_role }}">Get started</a>
  </div>
  <button class="site-menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open navigation menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
</header>
